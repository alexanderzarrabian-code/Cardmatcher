<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Binder Buddy</title>
<style>
:root{--bg:#0b0820;--fg:#f1eeff;--card:rgba(32,24,74,.78);--ac:#d946ef;--mu:#b5acd9;--gold:#8b7bff;--blue:#22d3ee;--line:#4b3f9e;--aqua:#22e4c8;--shadow:0 4px 0 rgba(0,0,0,.4),0 0 18px rgba(139,123,255,.25)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0b0820}
body{margin:0;padding:0 14px 28px;font:16px/1.4 "Trebuchet MS","Avenir Next",system-ui,sans-serif;color:var(--fg);max-width:640px;margin:auto;min-height:100vh;
  background:
   radial-gradient(1.2px 1.2px at 12% 18%,#fff 98%,transparent),radial-gradient(1px 1px at 78% 8%,#cfe 98%,transparent),
   radial-gradient(1.4px 1.4px at 38% 44%,#fff 98%,transparent),radial-gradient(1px 1px at 88% 52%,#fdf 98%,transparent),
   radial-gradient(1.2px 1.2px at 22% 72%,#cff 98%,transparent),radial-gradient(1px 1px at 64% 86%,#fff 98%,transparent),
   radial-gradient(1.3px 1.3px at 52% 22%,#fff 98%,transparent),radial-gradient(1px 1px at 6% 90%,#fff 98%,transparent),
   radial-gradient(ellipse 80% 40% at 90% 0%,rgba(217,70,239,.28),transparent 70%),
   radial-gradient(ellipse 70% 45% at 0% 55%,rgba(34,211,238,.16),transparent 70%),
   radial-gradient(ellipse 90% 50% at 60% 100%,rgba(99,70,230,.35),transparent 70%),
   linear-gradient(180deg,#0b0820,#120a33 60%,#0b0820);
  background-repeat:no-repeat;background-attachment:fixed}
.banner{margin:0 -14px 16px;padding:22px 16px 18px;text-align:center;background:linear-gradient(135deg,#3b1d8f 0%,#a21caf 52%,#0891b2 100%);color:#fff;border-bottom:4px solid #22d3ee;position:relative;overflow:hidden}
.banner h1{margin:0;font:900 30px/1.1 "Arial Black","Trebuchet MS",system-ui,sans-serif;letter-spacing:.5px;text-shadow:0 0 14px rgba(255,255,255,.55),0 3px 0 rgba(0,0,0,.3)}
.banner p{margin:6px 0 0;font-size:14px;font-weight:700;opacity:.95}
.spark{position:absolute;color:#fff7c2;font-size:18px;animation:tw 2.4s ease-in-out infinite}
.spark:nth-child(1){right:18px;top:10px}.spark:nth-child(2){left:22px;top:30px;font-size:12px;animation-delay:.7s}.spark:nth-child(3){left:72px;top:10px;font-size:14px;animation-delay:1.3s}.spark:nth-child(4){right:64px;top:44px;font-size:11px;animation-delay:.3s}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(25deg)}}
.pick{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,#a21caf,#d946ef);color:#fff;font-size:17px;font-weight:800;text-align:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:none}
label.btn.alt{background:linear-gradient(135deg,#4338ca,#22d3ee)}
.row{display:flex;gap:8px;margin:10px 0}
input[type=text],input[type=number]{flex:1;min-width:0;padding:12px;border-radius:12px;border:2px solid var(--line);background:rgba(15,10,45,.85);color:var(--fg);font-size:16px}
input::placeholder{color:#8a80bd}
input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 10px rgba(34,211,238,.45)}
#num{flex:0 0 110px}
[hidden]{display:none!important}
button.item{border:3px solid var(--gold);text-align:left;font:inherit;cursor:pointer;width:100%}
select{padding:8px;border-radius:10px;background:rgba(15,10,45,.85);color:var(--fg);border:2px solid var(--line);font-size:15px}
.mu{color:var(--mu);font-size:14px}
h3{font:900 17px/1.2 "Arial Black","Trebuchet MS",system-ui,sans-serif;margin:18px 0 8px;color:#7ee7ff;text-shadow:0 0 10px rgba(34,211,238,.35)}
.hero{display:flex;gap:12px;background:var(--card);border:4px solid transparent;border-radius:16px;padding:12px;margin:14px 0;box-shadow:var(--shadow);animation:pop .35s ease-out;
  background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#8b7bff,#22d3ee,#d946ef) border-box}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.hero img{flex:0 0 110px;width:110px;height:auto;align-self:flex-start;border-radius:8px;box-shadow:0 0 14px rgba(139,123,255,.5)}
.price{display:inline-block;font:900 26px/1 "Arial Black",system-ui,sans-serif;color:#052e2a;background:linear-gradient(135deg,#22e4c8,#7ee7ff);padding:6px 12px;border-radius:12px;margin:4px 0;box-shadow:0 0 16px rgba(34,228,200,.5)}
.warn{display:inline-block;color:#4a3000;background:#ffd54a;border:2px solid #d99a00;border-radius:8px;padding:2px 8px;font-size:12.5px;font-weight:800;margin:3px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.item{position:relative;background:var(--card);border:3px solid transparent;border-radius:14px;padding:8px;text-decoration:none;color:inherit;font-size:14px;box-shadow:var(--shadow);transition:transform .12s;overflow:hidden;
  background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#8b7bff,#22d3ee) border-box}
.item:active{transform:scale(.97)}
.item b{display:block;margin-top:4px}
.item img{width:100%;border-radius:6px;display:block}
.item::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.4) 45%,rgba(120,200,255,.3) 52%,rgba(255,150,230,.3) 58%,transparent 72%)}
.item:hover::after,.item:active::after{opacity:1}
.item .tag{display:inline-block;margin-top:5px;background:linear-gradient(135deg,#22e4c8,#7ee7ff);color:#052e2a;font-weight:800;border-radius:9px;padding:2px 8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:99px;background:rgba(32,24,74,.9);border:2px solid var(--line);color:var(--fg);font-size:13px;font-weight:700;cursor:pointer}
.chip[data-d]{border-color:#22d3ee;color:#7ee7ff}
.chip[data-v]{border-width:2px;color:#e9e4ff}
.chip[data-v^="Holofoil"]{background:linear-gradient(120deg,#2b2370,#3a2a86)}
.chip[data-v^="Reverse"]{background:linear-gradient(120deg,#0f4a5a,#2b2370)}
.chip[data-v^="1st"]{background:linear-gradient(120deg,#6b2470,#2b2370)}
#status{font-weight:700}
.chip.on{background:linear-gradient(135deg,#a21caf,#d946ef)!important;border-color:#f0abfc!important;color:#fff!important}
.lang{display:inline-block;background:#f43f5e;color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px}
details summary{cursor:pointer}
label.mu{color:var(--mu)}
.bsum{list-style:none;cursor:pointer;text-align:center;font-weight:800;font-size:17px;color:#fff;padding:13px;border-radius:14px;background:linear-gradient(135deg,#3b1d8f,#a21caf 60%,#0891b2);border:2px solid var(--blue);box-shadow:var(--shadow)}.bsum::-webkit-details-marker{display:none}#browse[open] .bsum{margin-bottom:6px}
.tabs{display:flex;gap:8px;margin:12px 0}.tab{flex:1;padding:11px;border-radius:12px;border:2px solid var(--line);background:rgba(32,24,74,.9);color:var(--fg);font:800 15px system-ui;cursor:pointer}.tab.on{background:linear-gradient(135deg,#a21caf,#d946ef);border-color:transparent}
.bgrid{display:grid;gap:6px;background:rgba(32,24,74,.6);border:3px solid var(--line);border-radius:14px;padding:8px;margin:8px 0}
.pk{position:relative;aspect-ratio:5/7;border:2px dashed var(--line);border-radius:8px;background:rgba(11,8,32,.6);padding:0;overflow:hidden;color:var(--mu);font-size:24px;cursor:pointer}
.pk.has{border:2px solid transparent}.pk.sel{outline:3px solid var(--ac)}.pk img{width:100%;height:100%;object-fit:cover;display:block}
.pk .pp{position:absolute;left:0;right:0;bottom:0;background:rgba(5,46,42,.9);color:#7ff;font:800 11px system-ui;text-align:center;padding:2px 0}
.chip:disabled{opacity:.35}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;overflow:auto}
#modal .sheet{max-width:520px;margin:6vh auto;background:#14103a;border:2px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
#binderView select{flex:1;min-width:0}
.pk{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.pk.drag{opacity:.35}.pk.over{outline:3px solid var(--blue);box-shadow:0 0 14px var(--blue)}.ghost{position:fixed;z-index:60;pointer-events:none;border-radius:8px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.6),0 0 16px var(--ac);transform:scale(1.06) rotate(3deg);opacity:.95}.ghost img{width:100%;height:100%;object-fit:cover;display:block}
</style></head><body>
<div class="banner"><span class="spark">✦</span><span class="spark">✦</span><span class="spark">✦</span><span class="spark">✦</span><h1>Binder Buddy</h1><p>Snap a card. Find its price twins.</p></div>
<div class="tabs"><button class="tab on" data-tab="find">🔍 Find</button><button class="tab" data-tab="binders">📒 Binders</button></div>
<div id="findView">
<label class="btn" for="file">📷 Take a photo</label>
<input id="file" class="pick" type="file" accept="image/*" capture="environment">
<label class="btn alt" for="file2" style="margin-top:10px">🖼️ Choose from library</label>
<input id="file2" class="pick" type="file" accept="image/*">
<div class="row"><input id="name" type="text" placeholder="Card name"><input id="num" type="text" placeholder="e.g. 4/102"></div>
<button class="btn" id="go">Find price &amp; alternatives</button>
<div class="row mu" style="align-items:center;flex-wrap:wrap">Cards <button class="chip on" data-lang="en">English</button><button class="chip" data-lang="jp">Japanese</button><button class="chip" data-lang="both">Both</button></div>
<div class="row mu" style="align-items:center;flex-wrap:wrap">Price range ± $<input id="range" type="number" inputmode="decimal" min="0" step="5" value="5" style="flex:0 0 84px;width:84px;text-align:center;font-weight:800"><button class="chip" data-d="5">$5</button><button class="chip" data-d="10">$10</button><button class="chip" data-d="25">$25</button><button class="chip" data-d="50">$50</button><button class="chip" data-d="100">$100</button></div>
<details class="mu" id="browse" style="margin-top:14px"><summary class="bsum">💰 Browse by price</summary>
<div class="row" style="margin-top:8px"><input id="bmin" type="number" inputmode="decimal" placeholder="Min $"><input id="bmax" type="number" inputmode="decimal" placeholder="Max $"></div>
<div class="row"><input id="bname" type="text" placeholder="Pokémon name (optional)"></div>
<div class="row mu" style="align-items:center;flex-wrap:wrap">Sort <button class="chip on" data-bs="hi">Price ↓</button><button class="chip" data-bs="lo">Price ↑</button><label style="margin-left:6px"><input type="checkbox" id="binc"> include uncertain</label></div>
<button class="btn" id="bgo">Show cards in this range</button></details>
<p class="mu" id="status"></p>
<details class="mu" id="dbgbox" style="display:none"><summary>What the scanner saw</summary><div id="dbgimg"></div><pre id="dbgtxt" style="white-space:pre-wrap;font-size:12px"></pre></details>
<div id="out"></div>
</div>
<div id="binderView" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const status=t=>$('#status').textContent=t||'';
const money=v=>'$'+v.toFixed(2);
const S={card:null,v:null,alts:[],shown:60,list:[],incl:false,lang:'en',scanSet:'',note:''};
document.querySelectorAll('.chip[data-d]').forEach(b=>b.onclick=()=>{$('#range').value=b.dataset.d;if(S.card)render()});

// ---- Price data: prices.json is rebuilt every night by the GitHub job ----
const DATA={cards:[],jp:[],updated:'',jpUpdated:'',ready:null,jpReady:null};
const activeCards=()=>S.lang==='jp'?DATA.jp:S.lang==='both'?DATA.cards.concat(DATA.jp):DATA.cards;
function norm(c){
  c.lang=c.lang||'en';c.name=c.n;c.set=c.s;c.number=c.no||'';c.rarity=c.r||'';c.year=(c.d||'').slice(0,4);
  c.vk=Object.keys(c.v);
  const m=c.number.match(/^(.*?)\s*\/\s*(\d+)\s*$/);
  c.num=(m?m[1]:c.number).replace(/^0+(?=\d)/,'').toLowerCase();c.tot=m?+m[2]:0;
  c.hay=(c.n+' '+c.s).toLowerCase();
  c.url='https://www.tcgplayer.com/product/'+c.i;
  c.img=c.im||('https://tcgplayer-cdn.tcgplayer.com/product/'+c.i+'_200w.jpg');
  return c}
function loadData(){
  if(DATA.ready)return DATA.ready;
  DATA.ready=(async()=>{
    status('Loading card prices…');
    let r;try{r=await fetch('prices.json',{cache:'no-cache'})}catch(e){DATA.ready=null;throw new Error('Could not load the price file (check your connection).')}
    if(r.status===404){DATA.ready=null;throw new Error("The price file isn't built yet. On GitHub, open the Actions tab, run 'Update prices', then reload this page.")}
    if(!r.ok){DATA.ready=null;throw new Error('Could not load the price file ('+r.status+').')}
    const j=await r.json();DATA.cards=j.cards.map(c=>norm(c));DATA.updated=j.updated||'';status('');return DATA})();
  return DATA.ready}
function loadJP(){
  if(DATA.jpReady)return DATA.jpReady;
  DATA.jpReady=(async()=>{
    status('Loading Japanese prices…');
    let r;try{r=await fetch('prices_jp.json',{cache:'no-cache'})}catch(e){DATA.jpReady=null;throw new Error('Could not load Japanese prices (check your connection).')}
    if(r.status===404){DATA.jpReady=null;throw new Error("Japanese prices aren't built yet. On GitHub, open the Actions tab, run 'Update prices', wait for the green check, then reload.")}
    if(!r.ok){DATA.jpReady=null;throw new Error('Could not load Japanese prices ('+r.status+').')}
    const j=await r.json();DATA.jp=j.cards.map(c=>{c.lang='jp';return norm(c)});DATA.jpUpdated=j.updated||'';status('');return DATA})();
  return DATA.jpReady}
const needJP=()=>S.lang==='jp'||S.lang==='both';
async function setLang(l){
  const prev=S.lang;S.lang=l;
  document.querySelectorAll('.chip[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
  try{await loadData();if(needJP())await loadJP();status('')}
  catch(e){S.lang=prev;document.querySelectorAll('.chip[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===prev));status(e.message);return e.message}
  if(S.card){S.alts=[];findAlts();draw()}
  return ''}
document.querySelectorAll('.chip[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
const asOf=()=>DATA.updated?new Date(DATA.updated).toLocaleDateString():'unknown';
const mk=(c,k)=>c.v[k][0];
// Link that opens TCGplayer on this printing, Near Mint
const link=(c,k)=>c.url+'?Language=English&Printing='+encodeURIComponent(k).replace(/%20/g,'+')+'&Condition=Near+Mint';
// A price is 'uncertain' when market and lowest listing disagree by more than 3x (and it's not a cheap card)
const shaky=(c,k)=>{const v=c.v[k],m=v[0],l=v[1];return m>0&&l>0&&Math.max(m,l)>=40&&(l>3*m||m>3*l)};

const loadImg=f=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(f)});
function crop(img,x,y,w,h,outW,mode){
  const sw=img.width*w,sh=img.height*h,sc=outW/sw,c=document.createElement('canvas');
  c.width=outW;c.height=Math.max(1,Math.round(sh*sc));const g=c.getContext('2d');
  g.drawImage(img,img.width*x,img.height*y,sw,sh,0,0,c.width,c.height);
  const d=g.getImageData(0,0,c.width,c.height),px=d.data,L=new Float32Array(px.length/4);let sum=0;
  for(let i=0,j=0;i<px.length;i+=4,j++){L[j]=.3*px[i]+.59*px[i+1]+.11*px[i+2];sum+=L[j]}
  const mean=sum/L.length;
  for(let i=0,j=0;i<px.length;i+=4,j++){
    const l=L[j];let v;
    if(mode==='bin')v=l>mean*.8?255:0;            // dark text on light card
    else if(mode==='inv')v=l<mean*1.2?255:0;      // light text on dark card
    else v=Math.max(0,Math.min(255,(l-mean)*1.8+128));
    px[i]=px[i+1]=px[i+2]=v}
  g.putImageData(d,0,0);return c}
const SCAN_URL='https://cardscan.alexanderzarrabian.workers.dev';
async function claudeRead(img){
  const sc=Math.min(1,1200/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const b64=c.toDataURL('image/jpeg',.85).split(',')[1];
  const r=await fetch(SCAN_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({image:b64})});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error(j.error||('scan service error '+r.status));
  return j}
const SKIP=/^(basic|stage|hp|trainer|pokemon|pokémon|item|supporter|evolves|from|ability|attack)$/i;
const MODES=['gray','bin','inv'];
async function readNumber(w,img,dbg){
  for(const r of [[0,.87,1,.12],[0,.87,.5,.12],[.5,.87,.5,.12]])for(const mode of MODES){
    const cv=crop(img,...r,r[2]===1?1400:900,mode);
    const {data:{text}}=await w.recognize(cv);
    dbg.push(`number ${r[0]}/${r[2]} ${mode}: ${text.trim().replace(/\n/g,' ')}`);
    const m=text.match(/(\d{1,3})\s*[\/Il|]\s*(\d{2,3})/);
    if(m&&+m[2]>=10){dbg.cv=cv;return String(parseInt(m[1],10))+'/'+m[2]}}
  return ''}
async function readName(w,img,dbg){
  const votes={};
  for(const r of [[.04,.03,.72,.1],[.02,.02,.85,.14]])for(const mode of MODES){
    const {data:{text}}=await w.recognize(crop(img,...r,1200,mode));
    dbg.push(`name ${r[1]} ${mode}: ${text.trim().replace(/\n/g,' ')}`);
    for(const line of text.split('\n')){
      const ws=(line.match(/[A-Za-z]{3,}/g)||[]).filter(x=>!SKIP.test(x));
      if(ws.length){const k=ws[0].toLowerCase();votes[k]=(votes[k]||0)+1;break}}}
  const best=Object.entries(votes).sort((a,b)=>b[1]-a[1]||b[0].length-a[0].length)[0];
  return best?best[0][0].toUpperCase()+best[0].slice(1):''}
// Turns the scanner's answer into the search boxes + language setting. Returns the name to search.
async function applyScan(r){
  const lg=String(r.language||'').toLowerCase(),nm=(r.name_english||r.name||'').trim();
  let num=r.number?r.number+(r.set_total?'/'+r.set_total:''):'';
  S.note='';S.scanSet=r.set_code||'';
  if(/japan/.test(lg)){const er=await setLang('jp');if(er)S.note=er}
  else if(/chin|korea|other/.test(lg)){
    const er=await setLang('both');num='';S.scanSet='';
    S.note=(/chin/.test(lg)?'Chinese':/korea/.test(lg)?'Korean':'Non-English')+" card detected. TCGplayer doesn't list this language, so there's no price for the exact card. Showing matches for the same Pokémon instead."+(er?' ('+er+')':'')}
  else if(/engl/.test(lg)&&S.lang==='jp'){await setLang('en')}
  $('#name').value=nm;$('#num').value=num;
  return nm||num}
const onPick=async e=>{
  const f=e.target.files[0];if(!f)return;
  let scanErr='';
  try{status('Scanning your card…');const img0=await loadImg(f),r=await claudeRead(img0);
    const ok=await applyScan(r);
    $('#dbgtxt').textContent=JSON.stringify(r,null,1);
    if(ok){$('#go').click();return}
    scanErr='Scanner answered but could not read the card: '+JSON.stringify(r);status("Couldn't identify it. Trying the backup reader…")}
  catch(err){scanErr='SCAN SERVICE FAILED: '+err.message;status('Scan service unavailable ('+err.message+'). Trying the backup reader…')}
  if(!window.Tesseract){status('OCR failed to load. Type the name and number instead.');return}
  try{
    status('Reading card… this takes about 10 seconds.');
    const img=await loadImg(f),w=await Tesseract.createWorker('eng'),dbg=[];
    await w.setParameters({tessedit_pageseg_mode:'6',tessedit_char_whitelist:'0123456789/ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'});
    const num=await readNumber(w,img,dbg),name=await readName(w,img,dbg);
    await w.terminate();
    $('#name').value=name;$('#num').value=num;
    $('#dbgtxt').textContent=(scanErr?scanErr+'\n\n':'')+dbg.join('\n');if(scanErr){$('#dbgbox').style.display='';$('#dbgbox').open=true}
    const box=$('#dbgimg');box.innerHTML='';if(dbg.cv){dbg.cv.style.width='100%';box.appendChild(dbg.cv)}
    if(name||num){$('#go').click()}
    else status("Couldn't read the card. Retake it with the card filling the frame and no glare, or type it in.");
  }catch(err){status('Could not read photo: '+err.message)}};
$('#file').onchange=onPick;$('#file2').onchange=onPick;



// ---- Browse by price ----
const B={items:[],shown:60,sort:'hi'};
document.querySelectorAll('.chip[data-bs]').forEach(b=>b.onclick=()=>{B.sort=b.dataset.bs;document.querySelectorAll('.chip[data-bs]').forEach(x=>x.classList.toggle('on',x===b));if(B.items.length)browseRun()});
$('#bgo').onclick=async()=>{

function browseRun(){
  S.card=null;
  const lo=parseFloat($('#bmin').value)||0,hiRaw=parseFloat($('#bmax').value),hi=isNaN(hiRaw)?Infinity:hiRaw,inc=$('#binc').checked;
  if(lo===0&&hi===Infinity&&!$('#bname').value.trim()){status('Enter a min and/or max price.');return}
  const words=$('#bname').value.toLowerCase().replace(/[^a-z0-9é' ]/g,' ').split(/\s+/).filter(Boolean);

    if(!words.every(w=>c.hay.includes(w)))continue;
    let best=null;
    for(const k of c.vk){const m=c.v[k][0];if(m>0&&m>=lo&&m<=hi&&(inc||!shaky(c,k))&&(!best||m>best.a))best={c,k,a:m}}
    if(best)items.push(best)}
  items.sort((x,y)=>B.sort==='hi'?y.a-x.a:x.a-y.a);
  B.items=items;B.shown=60;browseDraw(lo,hi)}
function browseDraw(lo,hi){

  $('#out').innerHTML=`<h3>${B.items.length} cards ${rng} (Near Mint market price)</h3><div class="grid">${B.items.slice(0,B.shown).map(x=>`<a class="item" target="_blank" rel="noopener" href="${esc(link(x.c,x.k))}"><img src="${esc(x.c.img)}" loading="lazy" alt=""><b>${esc(x.c.name)}</b><div class="mu">${esc(x.c.set)}${x.c.lang==='jp'?'<span class="lang">JP</span>':''} #${esc(x.c.number)}<br>Near Mint · ${esc(x.k)}</div><div><span class="tag">${money(x.a)}</span>${shaky(x.c,x.k)?' <span class="warn">⚠ uncertain</span>':''}</div></a>`).join('')||'<p class="mu">No cards in this range.</p>'}</div>${B.items.length>B.shown?'<button class="btn" id="bmore" style="margin-top:10px">Show more</button>':''}`;

// ---- Search ----
function search(nameText,numText,setCode){
  const words=nameText.toLowerCase().replace(/[^a-z0-9é' ]/g,' ').split(/\s+/).filter(Boolean);
  const m=numText.match(/([A-Za-z]*\d+)\s*(?:\/\s*(\d+))?/);
  const num=m?m[1].replace(/^0+(?=\d)/,'').toLowerCase():'',tot=m&&m[2]?+m[2]:0;
  let list=activeCards().filter(c=>words.every(w=>c.hay.includes(w))&&(!num||c.num===num));
  if(tot){const t=list.filter(c=>c.tot===tot);if(t.length)list=t}
  if(setCode&&list.length>1){const sc=setCode.toLowerCase();const t=list.filter(c=>c.s.toLowerCase().includes(sc));if(t.length)list=t}
  list.sort((a,b)=>(a.hay.length-b.hay.length)||((b.d||'').localeCompare(a.d||'')));
  return list}

$('#go').onclick=async()=>{
  const n=$('#name').value.trim(),nn=$('#num').value.trim();
  if(!n&&!nn){status('Enter a name or number.');return}
  try{
    await loadData();if(needJP())await loadJP();status('');
    const sc=S.scanSet,note=S.note;S.scanSet='';S.note='';
    let list=search(n,nn,sc),fb='';
    if(!list.length&&n.split(/\s+/).filter(Boolean).length>1){const ws=n.split(/\s+/).filter(Boolean);
      for(let k=ws.length-1;k>=1&&!list.length;k--){const t=search(ws.slice(0,k).join(' '),nn,sc);if(t.length){list=t;fb=`No exact match for "${n}". Showing all "${ws.slice(0,k).join(' ')}" cards instead. Promo cards are often filed under their own set (like "Scarlet & Violet Promo Cards"), so try scrolling for the right one.`}}}
    S.list=list;S.pshow=80;
    if(!list.length){status(`No cards found for "${[n,nn].filter(Boolean).join(' ')}". Try fewer words or just the name.`+(note?' '+note:''));$('#out').innerHTML='';return}
    list.length===1?pick(list[0]):picker();
    if(fb)status(fb);else if(note)status(note);
  }catch(err){status(err.message)}};

const snip=c=>{const a=c.vk.map(k=>c.v[k][0]).filter(x=>x>0);if(!a.length)return'<span class="mu">no price</span>';const lo=Math.min(...a),hi=Math.max(...a),bad=c.vk.some(k=>shaky(c,k));return `<span class="tag">${lo===hi?money(lo):money(lo)+' – '+money(hi)}</span>${bad?' <span class="warn">⚠ uncertain</span>':''}`};
const topPrice=c=>Math.max(0,...c.vk.map(k=>c.v[k][0]));
function picker(){
  S.card=null;if(!S.pshow)S.pshow=80;
  const L=S.list.slice();if(S.psort)L.sort((a,b)=>S.psort==='hi'?topPrice(b)-topPrice(a):topPrice(a)-topPrice(b));
  S.shownList=L;
  $('#out').innerHTML=`<h3>Which one is yours? (${L.length} matches${L.length>S.pshow?', showing '+S.pshow:''})</h3><div class="row mu" style="align-items:center;flex-wrap:wrap">Sort <button class="chip${!S.psort?' on':''}" data-ps="">Best match</button><button class="chip${S.psort==='hi'?' on':''}" data-ps="hi">Price ↓</button><button class="chip${S.psort==='lo'?' on':''}" data-ps="lo">Price ↑</button></div><div class="grid">${L.slice(0,S.pshow).map((c,i)=>`<button class="item" data-i="${i}"><img src="${esc(c.img)}" loading="lazy" alt=""><b>${esc(c.name)}</b><div class="mu">${esc(c.set)}${c.year?' ('+esc(c.year)+')':''}${c.lang==='jp'?'<span class="lang">JP</span>':''}<br>#${esc(c.number)} · ${esc(c.rarity)}</div><div>${snip(c)}</div></button>`).join('')}</div>${L.length>S.pshow?'<button class="btn" id="pmore" style="margin-top:10px">Show more</button>':''}`;
  document.querySelectorAll('#out .item').forEach(b=>b.onclick=()=>pick(S.shownList[b.dataset.i]));
  if($('#pmore'))$('#pmore').onclick=()=>{S.pshow+=80;picker()};
  document.querySelectorAll('#out .chip[data-ps]').forEach(b=>b.onclick=()=>{S.psort=b.dataset.ps;picker()});}

function pick(c){S.card=c;S.v=c.vk[0];render()}

function render(){

// ---- Alternatives: every card with any printing priced within +/- $range ----
function findAlts(){
  const d=Math.max(1,+$('#range').value||5),lo=Math.max(0,S.budget-d),hi=S.budget+d;
  S.lo=lo;S.hi=hi;S.shown=60;S.alts=[];
  for(const c of activeCards()){
    if(c.i===S.card.i)continue;
    let best=null;
    for(const k of c.vk){if(!S.incl&&shaky(c,k))continue;const a=c.v[k][0];if(a>=lo&&a<=hi&&(!best||Math.abs(a-S.budget)<Math.abs(best.a-S.budget)))best={k,a}}
    if(best)S.alts.push({c,...best})}}

function draw(){
  const s=$('#sort').value,T=S.budget,a=S.alts.slice();
  a.sort(s==='lo'?(x,y)=>x.a-y.a:s==='hi'?(x,y)=>y.a-x.a:s==='az'?(x,y)=>x.c.name.localeCompare(y.c.name):(x,y)=>Math.abs(x.a-T)-Math.abs(y.a-T));
  $('#h').textContent=`${a.length} cards from ${money(S.lo)} to ${money(S.hi)} (Near Mint market price)`;
  $('#sim').innerHTML=a.slice(0,S.shown).map(x=>`<a class="item" target="_blank" rel="noopener" href="${esc(link(x.c,x.k))}"><img src="${esc(x.c.img)}" loading="lazy" alt=""><b>${esc(x.c.name)}</b><div class="mu">${esc(x.c.set)}${x.c.lang==='jp'?'<span class="lang">JP</span>':''} #${esc(x.c.number)}<br>Near Mint · ${esc(x.k)}</div><div><span class="tag">${money(x.a)}</span>${shaky(x.c,x.k)?' <span class="warn">⚠ uncertain</span>':''}</div></a>`).join('')||'<p class="mu">No cards in this range. Try a wider range.</p>';
  const left=a.length-S.shown;
  $('#more').hidden=left<=0;$('#more').textContent=`Show more (${left} left)`}

async function bPicker(b,i){
  modal(`<h3>Add a card</h3><input id="bq" type="text" placeholder="Pokémon name (add a number like 4/102 if you want)" style="width:100%"><div class="row mu" style="align-items:center;flex-wrap:wrap">Show <button class="chip on" data-pl="en">English</button><button class="chip" data-pl="jp">Japanese</button><button class="chip" data-pl="both">Both</button></div><p class="mu" id="bpmsg">Loading cards…</p><div id="bpres"></div><button class="btn alt" id="no" style="margin-top:8px">Cancel</button>`);

    const toks=$('#bq').value.toLowerCase().replace(/[^a-z0-9é'\/ ]/g,' ').split(/\s+/).filter(Boolean);

    list.sort((a,b)=>(a.hay.length-b.hay.length)||((b.d||'').localeCompare(a.d||'')));
    const L=list.slice(0,40);
    $('#bpmsg').textContent=list.length?`${list.length} matches${list.length>40?', showing 40':''}`:'No cards found.';
    $('#bpres').innerHTML=L.map((c,n)=>`<button class="item" data-n="${n}" style="display:flex;gap:10px;margin-bottom:8px;align-items:center"><img src="${esc(c.img)}" loading="lazy" alt="" style="width:56px;flex:0 0 56px"><div><b style="margin:0">${esc(c.name)}</b><div class="mu">${esc(c.set)}${c.lang==='jp'?'<span class="lang">JP</span>':''} · #${esc(c.number)}</div>${snip(c)}</div></button>`).join('');
    document.querySelectorAll('#bpres .item').forEach(el=>el.onclick=()=>bChoose(b,i,L[el.dataset.n]))};
  $('#bq').oninput=()=>{clearTimeout(t);t=setTimeout(run,200)};
  document.querySelectorAll('#modal .chip[data-pl]').forEach(c=>c.onclick=async()=>{
    pl=c.dataset.pl;document.querySelectorAll('#modal .chip[data-pl]').forEach(x=>x.classList.toggle('on',x===c));
    if(pl!=='en'&&!DATA.jp.length){$('#bpmsg').textContent='Loading Japanese prices…';try{await loadJP()}catch(e){$('#bpmsg').textContent=e.message;pl='en';document.querySelectorAll('#modal .chip[data-pl]').forEach(x=>x.classList.toggle('on',x.dataset.pl==='en'));return}}
    run()});
  setTimeout(()=>{const q=$('#bq');if(q)q.focus()},50)}

function bChoose(b,i,c){
  const put=k=>{b.pages[BD.page][i]={i:c.i,k};bSave();closeModal();bRender()};
  if(c.vk.length===1){put(c.vk[0]);return}
  modal(`<h3>${esc(c.name)}</h3><p class="mu">${esc(c.set)} · #${esc(c.number)}<br>Which printing? (Near Mint market price)</p>${c.vk.map((k,n)=>`<button class="btn alt" data-k="${n}" style="margin-bottom:8px">${esc(k)} · ${c.v[k][0]>0?money(c.v[k][0]):'no price'}${shaky(c,k)?' ⚠':''}</button>`).join('')}<button class="btn" id="no">Cancel</button>`);
  $('#no').onclick=closeModal;
  document.querySelectorAll('#modal [data-k]').forEach(el=>el.onclick=()=>put(c.vk[+el.dataset.k]))}

// export / import / share
function bExport(){
  const blob=new Blob([JSON.stringify({app:'binder-buddy',v:1,binders:BD.binders})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='binder-buddy-binders.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function bValid(b){return b&&typeof b.name==='string'&&Number.isInteger(b.cols)&&Number.isInteger(b.rows)&&b.cols>=1&&b.cols<=6&&b.rows>=1&&b.rows<=6&&Array.isArray(b.pages)&&b.pages.every(p=>Array.isArray(p))}
function bClean(b){
  const n=b.cols*b.rows;
  return {id:uid(),name:String(b.name).slice(0,40),cols:b.cols,rows:b.rows,pages:(b.pages.length?b.pages:[[]]).slice(0,200).map(p=>Array.from({length:n},(_,i)=>{const r=p[i];return r&&Number.isInteger(r.i)&&typeof r.k==='string'?{i:r.i,k:r.k}:null}))}}
function bWireImport(){
  const f=$('#bimpf'),btn=$('#bimp');if(!f||!btn)return;
  btn.onclick=()=>f.click();
  f.onchange=async()=>{
    const file=f.files[0];if(!file)return;
    try{const j=JSON.parse(await file.text());const arr=(j.binders||[]).filter(bValid).map(bClean);
      if(!arr.length)throw new Error('empty');
      BD.binders.push(...arr);BD.cur=arr[0].id;BD.page=0;bSave();status('Imported '+arr.length+' binder'+(arr.length>1?'s':'')+'.');bRender(true)}
    catch(e){status("That file doesn't look like a Binder Buddy export.")}
    f.value=''}}
const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))));
function bShare(b){
  const url=location.origin+location.pathname+'#binder='+b64e(JSON.stringify({name:b.name,cols:b.cols,rows:b.rows,pages:b.pages}));
  modal(`<h3>Share "${esc(b.name)}"</h3><p class="mu">Anyone who opens this link can add a copy of this binder to their own app.</p><input id="blink" type="text" readonly value="${esc(url)}" style="width:100%"><button class="btn" id="cp" style="margin-top:10px">Copy link</button><button class="btn alt" id="no" style="margin-top:8px">Close</button>`);
  $('#no').onclick=closeModal;$('#blink').onfocus=e=>e.target.select();
  $('#cp').onclick=async()=>{try{if(navigator.share){await navigator.share({title:'Binder Buddy: '+b.name,url});return}}catch(e){if(e&&e.name==='AbortError')return}
    try{await navigator.clipboard.writeText(url);$('#cp').textContent='Copied ✓'}catch(e){$('#blink').select();$('#cp').textContent='Press and hold the link to copy'}}}
function bCheckShared(){
  const m=location.hash.match(/^#binder=(.+)$/);if(!m)return;
  try{const b=JSON.parse(b64d(m[1]));if(!bValid(b))throw 0;const nb=bClean(b);
    showTab('binders');
    modal(`<h3>Add shared binder?</h3><p class="mu">"${esc(nb.name)}" · ${nb.pages.length} page${nb.pages.length>1?'s':''}, ${nb.pages.reduce((s,p)=>s+p.filter(Boolean).length,0)} cards</p><button class="btn" id="ok">Add to my binders</button><button class="btn alt" id="no" style="margin-top:8px">No thanks</button>`);
    const done=()=>{history.replaceState(null,'',location.pathname+location.search);closeModal()};
    $('#no').onclick=done;$('#ok').onclick=()=>{BD.binders.push(nb);BD.cur=nb.id;BD.page=0;bSave();done();bRender(true)}}
  catch(e){history.replaceState(null,'',location.pathname+location.search)}}

// ---- drag & drop cards between pockets (press and hold, then drag) ----
const DR={st:null,block:false,b:null};
function drCleanup(){const st=DR.st;if(!st)return;clearTimeout(st.timer);if(st.ghost)st.ghost.remove();if(st.el)st.el.classList.remove('drag');document.querySelectorAll('.pk.over').forEach(x=>x.classList.remove('over'));DR.st=null}
function drPick(){const st=DR.st;if(!st||st.on)return;st.on=true;
  const r=st.el.getBoundingClientRect(),g=document.createElement('div');g.className='ghost';g.style.width=r.width+'px';g.style.height=r.height+'px';
  const im=st.el.querySelector('img');if(im)g.innerHTML='<img src="'+im.src+'" alt="">';document.body.appendChild(g);st.ghost=g;st.el.classList.add('drag');
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}
  drMoveGhost(st.x,st.y)}
function drMoveGhost(x,y){const st=DR.st;if(!st||!st.ghost)return;const w=st.ghost.offsetWidth,h=st.ghost.offsetHeight;st.ghost.style.left=(x-w/2)+'px';st.ghost.style.top=(y-h/2)+'px';
  const t=document.elementFromPoint?document.elementFromPoint(x,y):null,pk=t&&t.closest?t.closest('.pk'):null;
  document.querySelectorAll('.pk.over').forEach(e=>e.classList.remove('over'));if(pk&&pk!==st.el)pk.classList.add('over');st.target=pk&&pk!==st.el?pk:null}
function drBegin(el,x,y,touch){if(BD.sel||DR.st)return;DR.st={el,x0:x,y0:y,x,y,on:false,touch,timer:null,target:null};if(touch)DR.st.timer=setTimeout(drPick,230)}
function drMove(e){const st=DR.st;if(!st)return;const p=e.touches?e.touches[0]:e;if(!p)return;st.x=p.clientX;st.y=p.clientY;
  if(!st.on){if(Math.hypot(st.x-st.x0,st.y-st.y0)>10){if(st.touch){drCleanup()}else{drPick()}}return}
  if(e.cancelable)e.preventDefault();drMoveGhost(st.x,st.y)}
function drEnd(){const st=DR.st;if(!st)return;
  if(st.on){DR.block=true;setTimeout(()=>{DR.block=false},120);
    const b=DR.b,t=st.target;
    if(t&&b){const a=+st.el.dataset.i,c=+t.dataset.i,pg=b.pages[BD.page];const tmp=pg[a];pg[a]=pg[c];pg[c]=tmp;bSave();drCleanup();bRender();return}}
  drCleanup()}
document.addEventListener('touchmove',drMove,{passive:false});document.addEventListener('mousemove',drMove);
document.addEventListener('touchend',drEnd);document.addEventListener('touchcancel',drCleanup);document.addEventListener('mouseup',drEnd);
function bWireDrag(b){DR.b=b;document.querySelectorAll('.pk.has').forEach(el=>{
  el.addEventListener('touchstart',e=>{const p=e.touches[0];drBegin(el,p.clientX,p.clientY,true)},{passive:true});
  el.addEventListener('mousedown',e=>{if(e.button===0)drBegin(el,e.clientX,e.clientY,false)})})}
bLoad();bCheckShared();
</script></body></html>
