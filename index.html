.trend{display:flex;align-items:center;gap:10px;margin:2px 4px 6px}.trend svg{flex:1;height:34px}
</style></head><body>
<div class="banner"><span class="spark">✦</span><span class="spark">✦</span><span class="spark">✦</span><span class="spark">✦</span><h1>Binder Buddy</h1><p>Snap a card. Find its price twins.</p></div>
<div class="tabs"><button class="tab on" data-tab="find">🔍 Find</button><button class="tab" data-tab="binders">📒 Binders</button><button class="tab" data-tab="trade">🔄 Trade</button></div>
<div id="findView">
<div class="cams"><label class="btn" for="file">📷 Take photo</label>
<input id="file" class="pick" type="file" accept="image/*" capture="environment">
<label class="btn alt" for="file2">🖼️ Library</label></div>
<input id="file2" class="pick" type="file" accept="image/*">
<div class="row"><input id="name" type="text" placeholder="Card name"><input id="num" type="text" placeholder="e.g. 4/102"></div>
<button class="btn" id="go">Find price &amp; alternatives</button>
<div class="panel"><div class="prow"><span>Cards</span><div class="chips"><button class="chip on" data-lang="en">English</button><button class="chip" data-lang="jp">Japanese</button><button class="chip" data-lang="both">Both</button></div></div>
<div class="prow"><span>Price range ± $</span><input id="range" type="number" inputmode="decimal" min="0" step="5" value="5"></div>
<div class="chips"><button class="chip" data-d="5">$5</button><button class="chip" data-d="10">$10</button><button class="chip" data-d="25">$25</button><button class="chip" data-d="50">$50</button><button class="chip" data-d="100">$100</button></div></div>
<details class="mu" id="browse" style="margin-top:14px"><summary class="bsum">💰 Browse by price</summary>
<div class="row" style="margin-top:8px"><input id="bmin" type="number" inputmode="decimal" placeholder="Min $"><input id="bmax" type="number" inputmode="decimal" placeholder="Max $"></div>
<div class="row"><input id="bname" type="text" placeholder="Pokémon name (optional)"></div>
<div class="row mu" style="align-items:center;flex-wrap:wrap">Sort <button class="chip on" data-bs="hi">Price ↓</button><button class="chip" data-bs="lo">Price ↑</button><label style="margin-left:6px"><input type="checkbox" id="binc"> include uncertain</label></div>
<button class="btn" id="bgo">Show cards in this range</button></details>
<p class="mu" id="status"></p>
<details class="mu" id="dbgbox" style="display:none"><summary>What the scanner saw</summary><div id="dbgimg"></div><pre id="dbgtxt" style="white-space:pre-wrap;font-size:12px"></pre></details>
<div id="out"></div>
</div>
<div id="binderView" hidden></div>
<div id="tradeView" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const status=t=>$('#status').textContent=t||'';
const money=v=>'$'+v.toFixed(2);
const S={card:null,v:null,alts:[],shown:60,list:[],incl:false,lang:'en',scanSet:'',note:''};
document.querySelectorAll('.chip[data-d]').forEach(b=>b.onclick=()=>{$('#range').value=b.dataset.d;if(S.card)render()});

// ---- Price data: prices.json is rebuilt every night by the GitHub job ----
const DATA={cards:[],jp:[],updated:'',jpUpdated:'',ready:null,jpReady:null};
const activeCards=()=>S.lang==='jp'?DATA.jp:S.lang==='both'?DATA.cards.concat(DATA.jp):DATA.cards;
function norm(c){
  c.lang=c.lang||'en';c.name=c.n;c.set=c.s;c.number=c.no||'';c.rarity=c.r||'';c.year=(c.d||'').slice(0,4);
  c.vk=Object.keys(c.v);
  const m=c.number.match(/^(.*?)\s*\/\s*(\d+)\s*$/);
  c.num=(m?m[1]:c.number).replace(/^0+(?=\d)/,'').toLowerCase();c.tot=m?+m[2]:0;
  c.hay=(c.n+' '+c.s).toLowerCase();
  c.url='https://www.tcgplayer.com/product/'+c.i;
  c.img=c.im||('https://tcgplayer-cdn.tcgplayer.com/product/'+c.i+'_200w.jpg');
  return c}
function loadData(){
  if(DATA.ready)return DATA.ready;
  DATA.ready=(async()=>{
    status('Loading card prices…');
    let r;try{r=await fetch('prices.json',{cache:'no-cache'})}catch(e){DATA.ready=null;throw new Error('Could not load the price file (check your connection).')}
    if(r.status===404){DATA.ready=null;throw new Error("The price file isn't built yet. On GitHub, open the Actions tab, run 'Update prices', then reload this page.")}
    if(!r.ok){DATA.ready=null;throw new Error('Could not load the price file ('+r.status+').')}
    const j=await r.json();DATA.cards=j.cards.map(c=>norm(c));DATA.updated=j.updated||'';status('');return DATA})();
  return DATA.ready}
function loadJP(){
  if(DATA.jpReady)return DATA.jpReady;
  DATA.jpReady=(async()=>{
    status('Loading Japanese prices…');
    let r;try{r=await fetch('prices_jp.json',{cache:'no-cache'})}catch(e){DATA.jpReady=null;throw new Error('Could not load Japanese prices (check your connection).')}
    if(r.status===404){DATA.jpReady=null;throw new Error("Japanese prices aren't built yet. On GitHub, open the Actions tab, run 'Update prices', wait for the green check, then reload.")}
    if(!r.ok){DATA.jpReady=null;throw new Error('Could not load Japanese prices ('+r.status+').')}
    const j=await r.json();DATA.jp=j.cards.map(c=>{c.lang='jp';return norm(c)});DATA.jpUpdated=j.updated||'';status('');return DATA})();
  return DATA.jpReady}
const needJP=()=>S.lang==='jp'||S.lang==='both';
async function setLang(l){
  const prev=S.lang;S.lang=l;
  document.querySelectorAll('.chip[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
  try{await loadData();if(needJP())await loadJP();status('')}
  catch(e){S.lang=prev;document.querySelectorAll('.chip[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===prev));status(e.message);return e.message}
  if(S.card){S.alts=[];findAlts();draw()}
  return ''}
document.querySelectorAll('.chip[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
const asOf=()=>DATA.updated?new Date(DATA.updated).toLocaleDateString():'unknown';
const mk=(c,k)=>c.v[k][0];
// Link that opens TCGplayer on this printing, Near Mint
const link=(c,k)=>c.url+'?Language=English&Printing='+encodeURIComponent(k).replace(/%20/g,'+')+'&Condition=Near+Mint';
// A price is 'uncertain' when market and lowest listing disagree by more than 3x (and it's not a cheap card)
const shaky=(c,k)=>{const v=c.v[k],m=v[0],l=v[1];return m>0&&l>0&&Math.max(m,l)>=40&&(l>3*m||m>3*l)};

const loadImg=f=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(f)});
function crop(img,x,y,w,h,outW,mode){
  const sw=img.width*w,sh=img.height*h,sc=outW/sw,c=document.createElement('canvas');
  c.width=outW;c.height=Math.max(1,Math.round(sh*sc));const g=c.getContext('2d');
  g.drawImage(img,img.width*x,img.height*y,sw,sh,0,0,c.width,c.height);
  const d=g.getImageData(0,0,c.width,c.height),px=d.data,L=new Float32Array(px.length/4);let sum=0;
  for(let i=0,j=0;i<px.length;i+=4,j++){L[j]=.3*px[i]+.59*px[i+1]+.11*px[i+2];sum+=L[j]}
  const mean=sum/L.length;
  for(let i=0,j=0;i<px.length;i+=4,j++){
    const l=L[j];let v;
    if(mode==='bin')v=l>mean*.8?255:0;            // dark text on light card
    else if(mode==='inv')v=l<mean*1.2?255:0;      // light text on dark card
    else v=Math.max(0,Math.min(255,(l-mean)*1.8+128));
    px[i]=px[i+1]=px[i+2]=v}
  g.putImageData(d,0,0);return c}
const SCAN_URL='https://cardscan.alexanderzarrabian.workers.dev';
async function claudeRead(img,opt,retried){
  opt=opt||{};const maxd=opt.page?1600:1200;
  const sc=Math.min(1,maxd/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const b64=c.toDataURL('image/jpeg',opt.page?.8:.85).split(',')[1];
  const body={image:b64};if(opt.page){body.mode='page';body.cols=opt.cols;body.rows=opt.rows}
  const hdr={'content-type':'application/json'};let pass='';try{pass=localStorage.getItem('bb_pass')||''}catch(e){}if(pass)hdr['x-pass']=pass;
  const r=await fetch(SCAN_URL,{method:'POST',headers:hdr,body:JSON.stringify(body)});
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&j.error==='passcode'&&!retried){const p=window.prompt('Enter the app passcode to scan cards:');if(p){try{localStorage.setItem('bb_pass',p)}catch(e){}return claudeRead(img,opt,true)}}
  if(r.status===401&&j.error==='passcode')throw new Error('Wrong or missing passcode');
  if(!r.ok)throw new Error(j.error||('scan service error '+r.status));
  return j}
const SKIP=/^(basic|stage|hp|trainer|pokemon|pokémon|item|supporter|evolves|from|ability|attack)$/i;
const MODES=['gray','bin','inv'];
async function readNumber(w,img,dbg){
  for(const r of [[0,.87,1,.12],[0,.87,.5,.12],[.5,.87,.5,.12]])for(const mode of MODES){
    const cv=crop(img,...r,r[2]===1?1400:900,mode);
    const {data:{text}}=await w.recognize(cv);
    dbg.push(`number ${r[0]}/${r[2]} ${mode}: ${text.trim().replace(/\n/g,' ')}`);
    const m=text.match(/(\d{1,3})\s*[\/Il|]\s*(\d{2,3})/);
    if(m&&+m[2]>=10){dbg.cv=cv;return String(parseInt(m[1],10))+'/'+m[2]}}
  return ''}
async function readName(w,img,dbg){
  const votes={};
  for(const r of [[.04,.03,.72,.1],[.02,.02,.85,.14]])for(const mode of MODES){

function search(nameText,numText,setCode,pool){
  const words=nameText.toLowerCase().replace(/[^a-z0-9é' ]/g,' ').split(/\s+/).filter(Boolean);
  const m=numText.match(/([A-Za-z]*\d+)\s*(?:\/\s*(\d+))?/);
  const num=m?m[1].replace(/^0+(?=\d)/,'').toLowerCase():'',tot=m&&m[2]?+m[2]:0;
  let list=(pool||activeCards()).filter(c=>words.every(w=>c.hay.includes(w))&&(!num||c.num===num));
  if(tot){const t=list.filter(c=>c.tot===tot);if(t.length)list=t}
  if(setCode&&list.length>1){const sc=setCode.toLowerCase();const t=list.filter(c=>c.s.toLowerCase().includes(sc));if(t.length)list=t}
  list.sort((a,b)=>(a.hay.length-b.hay.length)||((b.d||'').localeCompare(a.d||'')));
  return list}

function bPocket(b,i){

async function bPicker(b,i){
  modal(`<h3>Add a card</h3><input id="bq" type="text" placeholder="Pokémon name (add a number like 4/102 if you want)" style="width:100%"><div class="row mu" style="align-items:center;flex-wrap:wrap">Show <button class="chip on" data-pl="en">English</button><button class="chip" data-pl="jp">Japanese</button><button class="chip" data-pl="both">Both</button></div><label class="mu" style="display:block;margin:6px 0"><input type="checkbox" id="bwish"> Add as wishlist (I don't own it yet)</label><p class="mu" id="bpmsg">Loading cards…</p><div id="bpres"></div><button class="btn alt" id="no" style="margin-top:8px">Cancel</button>`);

function bChoose(b,i,c){

// export / import / share
function bExport(){
  const blob=new Blob([JSON.stringify({app:'binder-buddy',v:1,binders:BD.binders})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='binder-buddy-binders.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function bValid(b){return b&&typeof b.name==='string'&&Number.isInteger(b.cols)&&Number.isInteger(b.rows)&&b.cols>=1&&b.cols<=6&&b.rows>=1&&b.rows<=6&&Array.isArray(b.pages)&&b.pages.every(p=>Array.isArray(p))}
function bClean(b){
  const n=b.cols*b.rows;
  return {id:uid(),name:String(b.name).slice(0,40),cols:b.cols,rows:b.rows,pages:(b.pages.length?b.pages:[[]]).slice(0,200).map(p=>Array.from({length:n},(_,i)=>{const r=p[i];return r&&Number.isInteger(r.i)&&typeof r.k==='string'?Object.assign({i:r.i,k:r.k},r.w?{w:1}:{},Number.isFinite(r.a)?{a:r.a}:{}):null}))}}
function bWireImport(){
  const f=$('#bimpf'),btn=$('#bimp');if(!f)return;
  if(btn)btn.onclick=()=>f.click();
  f.onchange=async()=>{
    const file=f.files[0];if(!file)return;
    try{const j=JSON.parse(await file.text());const arr=(j.binders||[]).filter(bValid).map(bClean);
      if(!arr.length)throw new Error('empty');
      BD.binders.push(...arr);BD.cur=arr[0].id;BD.page=0;bSave();status('Imported '+arr.length+' binder'+(arr.length>1?'s':'')+'.');bRender(true)}
    catch(e){status("That file doesn't look like a Binder Buddy export.")}
    f.value=''}}
const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))));
function bShare(b){
  const url=location.origin+location.pathname+'#binder='+b64e(JSON.stringify({name:b.name,cols:b.cols,rows:b.rows,pages:b.pages}));
  modal(`<h3>Share "${esc(b.name)}"</h3><p class="mu">Anyone who opens this link can add a copy of this binder to their own app.</p><input id="blink" type="text" readonly value="${esc(url)}" style="width:100%"><button class="btn" id="cp" style="margin-top:10px">Copy link</button><button class="btn alt" id="no" style="margin-top:8px">Close</button>`);
  $('#no').onclick=()=>closeModal();$('#blink').onfocus=e=>e.target.select();
  $('#cp').onclick=async()=>{try{if(navigator.share){await navigator.share({title:'Binder Buddy: '+b.name,url});return}}catch(e){if(e&&e.name==='AbortError')return}
    try{await navigator.clipboard.writeText(url);$('#cp').textContent='Copied ✓'}catch(e){$('#blink').select();$('#cp').textContent='Press and hold the link to copy'}}}
function bCheckShared(){
  const m=location.hash.match(/^#binder=(.+)$/);if(!m)return;
  try{const b=JSON.parse(b64d(m[1]));if(!bValid(b))throw 0;const nb=bClean(b);
    showTab('binders');
    modal(`<h3>Add shared binder?</h3><p class="mu">"${esc(nb.name)}" · ${nb.pages.length} page${nb.pages.length>1?'s':''}, ${nb.pages.reduce((s,p)=>s+p.filter(Boolean).length,0)} cards</p><button class="btn" id="ok">Add to my binders</button><button class="btn alt" id="no" style="margin-top:8px">No thanks</button>`);
    const done=()=>{history.replaceState(null,'',location.pathname+location.search);closeModal()};
    $('#no').onclick=done;$('#ok').onclick=()=>{BD.binders.push(nb);BD.cur=nb.id;BD.page=0;bSave();done();bRender(true)}}
  catch(e){history.replaceState(null,'',location.pathname+location.search)}}

// ---- drag & drop cards between pockets (press and hold, then drag) ----
const DR={st:null,block:false,b:null};
function drCleanup(){const st=DR.st;if(!st)return;clearTimeout(st.timer);if(st.ghost)st.ghost.remove();if(st.el)st.el.classList.remove('drag');document.querySelectorAll('.pk.over').forEach(x=>x.classList.remove('over'));DR.st=null}
function drPick(){const st=DR.st;if(!st||st.on)return;st.on=true;
  const r=st.el.getBoundingClientRect(),g=document.createElement('div');g.className='ghost';g.style.width=r.width+'px';g.style.height=r.height+'px';
  const im=st.el.querySelector('img');if(im)g.innerHTML='<img src="'+im.src+'" alt="">';document.body.appendChild(g);st.ghost=g;st.el.classList.add('drag');
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}
  drMoveGhost(st.x,st.y)}
function drMoveGhost(x,y){const st=DR.st;if(!st||!st.ghost)return;const w=st.ghost.offsetWidth,h=st.ghost.offsetHeight;st.ghost.style.left=(x-w/2)+'px';st.ghost.style.top=(y-h/2)+'px';
  const t=document.elementFromPoint?document.elementFromPoint(x,y):null,pk=t&&t.closest?t.closest('.pk'):null;
  document.querySelectorAll('.pk.over').forEach(e=>e.classList.remove('over'));if(pk&&pk!==st.el)pk.classList.add('over');st.target=pk&&pk!==st.el?pk:null}
function drBegin(el,x,y,touch){if(BD.sel||DR.st)return;DR.st={el,x0:x,y0:y,x,y,on:false,touch,timer:null,target:null};if(touch)DR.st.timer=setTimeout(drPick,230)}
function drMove(e){const st=DR.st;if(!st)return;const p=e.touches?e.touches[0]:e;if(!p)return;st.x=p.clientX;st.y=p.clientY;
  if(!st.on){if(Math.hypot(st.x-st.x0,st.y-st.y0)>10){if(st.touch){drCleanup()}else{drPick()}}return}
  if(e.cancelable)e.preventDefault();drMoveGhost(st.x,st.y)}
function drEnd(){const st=DR.st;if(!st)return;
  if(st.on){DR.block=true;setTimeout(()=>{DR.block=false},120);
    const b=DR.b,t=st.target;
    if(t&&b){const a=+st.el.dataset.i,c=+t.dataset.i,pg=b.pages[BD.page];const tmp=pg[a];pg[a]=pg[c];pg[c]=tmp;bSave();drCleanup();bRender();return}}
  drCleanup()}
document.addEventListener('touchmove',drMove,{passive:false});document.addEventListener('mousemove',drMove);
document.addEventListener('touchend',drEnd);document.addEventListener('touchcancel',drCleanup);document.addEventListener('mouseup',drEnd);
function bWireDrag(b){DR.b=b;document.querySelectorAll('.pk.has').forEach(el=>{
  el.addEventListener('touchstart',e=>{const p=e.touches[0];drBegin(el,p.clientX,p.clientY,true)},{passive:true});
  el.addEventListener('mousedown',e=>{if(e.button===0)drBegin(el,e.clientX,e.clientY,false)})})}

// ================= Trade (scan a stack, see its value, find cards worth about that) =================
const TK='bb_trade_v1';
const T={mine:[],theirs:[],pct:100,incl:false,mode:'about',range:5,lang:'en',review:[],msg:'',shown:40,results:[],rid:0};
function tLoad(){try{const j=JSON.parse(localStorage.getItem(TK)||'null');if(j){T.mine=Array.isArray(j.mine)?j.mine:[];T.theirs=Array.isArray(j.theirs)?j.theirs:[];T.pct=+j.pct||100;T.incl=!!j.incl}}catch(e){}}

function tSum(list){let val=0,skipped=0;for(const r of list){const c=cardById(r.i);if(!c||!c.v[r.k])continue;const m=c.v[r.k][0];if(!(m>0))continue;if(!T.incl&&shaky(c,r.k)){skipped++;continue}val+=m}return {val,skipped}}
const tPool=()=>T.lang==='jp'?DATA.jp:T.lang==='both'?DATA.cards.concat(DATA.jp):DATA.cards;
async function tEnsure(){try{await loadData()}catch(e){T.msg=e.message}

  v.innerHTML=`<h3 style="margin-top:6px">Your side <span class="mu">(${T.mine.length} card${T.mine.length===1?'':'s'})</span></h3>
  <div class="cams"><label class="btn" for="tfile">📷 Scan card</label><label class="btn alt" for="tfile2">🖼️ Scan photos</label></div>
  <input id="tfile" class="pick" type="file" accept="image/*" capture="environment"><input id="tfile2" class="pick" type="file" accept="image/*" multiple>
  <button class="btn alt" data-act="addmine" style="margin-bottom:8px">＋ Add by name</button>
  ${T.msg?`<p class="mu" id="tmsg" style="color:#ffd966">${esc(T.msg)}</p>`:''}
  ${T.review.length?`<h3>Needs a quick look (${T.review.length})</h3>${T.review.map(rv=>`<div class="review"><div style="display:flex;gap:10px;align-items:center">${rv.thumb?`<img src="${rv.thumb}" alt="" style="width:64px;border-radius:6px">`:''}<div><b>${esc(rv.label||'Unknown card')}</b><div class="mu">${esc(rv.note||'Tap the right one:')}</div></div></div>${rv.pairs.map((p,n)=>`<button class="item pair" data-act="pair" data-r="${rv.id}" data-p="${n}"><img src="${esc(p.c.img)}" loading="lazy" alt=""><div style="flex:1;min-width:0"><b style="margin:0">${esc(p.c.name)}</b>${p.c.lang==='jp'?'<span class="lang">JP</span>':''}<div class="mu">${esc(p.c.set)} · #${esc(p.c.number)}<br>${esc(p.k)}</div></div><span class="tag">${p.c.v[p.k][0]>0?money(p.c.v[p.k][0]):'—'}</span></button>`).join('')}<div class="row"><button class="chip" data-act="manual" data-r="${rv.id}">Search by name</button><button class="chip" data-act="skip" data-r="${rv.id}">Skip</button></div></div>`).join('')}`:''}
  ${T.mine.length?T.mine.map((r,i)=>tRow(r,'mine',i)).join(''):'<p class="mu">Scan or add the cards you want to trade or sell.</p>'}
  <div class="panel" style="margin-top:10px"><div class="prow"><span>Trade value %</span><input id="tpct" type="number" inputmode="decimal" min="1" max="200" value="${T.pct}"></div>
  <div class="chips"><button class="chip${T.pct===100?' on':''}" data-act="pct" data-v="100">100%</button><button class="chip${T.pct===90?' on':''}" data-act="pct" data-v="90">90%</button><button class="chip${T.pct===80?' on':''}" data-act="pct" data-v="80">80%</button><button class="chip${T.pct===70?' on':''}" data-act="pct" data-v="70">70%</button><button class="chip${T.pct===60?' on':''}" data-act="pct" data-v="60">60%</button></div>
  <p class="btot" style="margin-bottom:0"><b style="font-size:20px">Trade value ${money(tv)}</b><br><span>Market total ${money(a.val)} × ${T.pct}%</span></p>
  ${a.skipped?`<p class="mu" style="text-align:center;margin:4px 0">${a.skipped} card${a.skipped>1?'s':''} left out because of an uncertain price (⚠).</p>`:''}
  <label class="mu" style="display:block;text-align:center;margin-top:4px"><input type="checkbox" id="tinc"${T.incl?' checked':''}> count uncertain-price cards</label></div>
  <h3>Their side <span class="mu">(${T.theirs.length} card${T.theirs.length===1?'':'s'}, ${money(b.val)})</span></h3>
  ${T.theirs.length?T.theirs.map((r,i)=>tRow(r,'theirs',i)).join(''):'<p class="mu">Optional: add the cards you would get, or tap ＋ Get on a card below.</p>'}
  <button class="btn alt" data-act="addtheirs" style="margin:6px 0">＋ Add by name</button>
  ${T.mine.length?`<p class="btot"><b>${diff>=0?`You're ahead ${money(diff)}`:`You owe ${money(-diff)}`}</b><br><span>${T.theirs.length?'your trade value vs their market value':'nothing on their side yet'}</span></p>`:''}
  <h3>Cards worth about ${money(Math.max(0,diff))}</h3>
  <div class="panel"><div class="prow"><span>Cards</span><div class="chips"><button class="chip${T.lang==='en'?' on':''}" data-act="tlang" data-v="en">English</button><button class="chip${T.lang==='jp'?' on':''}" data-act="tlang" data-v="jp">Japanese</button><button class="chip${T.lang==='both'?' on':''}" data-act="tlang" data-v="both">Both</button></div></div>
  <div class="prow"><span>Show</span><div class="chips"><button class="chip${T.mode==='about'?' on':''}" data-act="mode" data-v="about">About this value</button><button class="chip${T.mode==='upto'?' on':''}" data-act="mode" data-v="upto">Up to this value</button></div></div>
  ${T.mode==='about'?`<div class="prow"><span>Range ± $</span><input id="trng" type="number" inputmode="decimal" min="0" step="5" value="${T.range}"></div><div class="chips"><button class="chip" data-act="rng" data-v="5">$5</button><button class="chip" data-act="rng" data-v="10">$10</button><button class="chip" data-act="rng" data-v="25">$25</button><button class="chip" data-act="rng" data-v="50">$50</button></div>`:''}</div>
  <div id="tres"></div>`;
  tWire();tResults();
}

function tResults(){
  const box=$('#tres');if(!box)return;
  const a=tSum(T.mine),b=tSum(T.theirs),target=Math.max(0,a.val*T.pct/100-b.val);
  if(!T.mine.length){box.innerHTML='<p class="mu">Add cards to your side to see what they could get you.</p>';return}
  if(target<=0){box.innerHTML='<p class="mu">Nothing left to spend. Their side already covers your trade value.</p>';return}
  const rg=Math.max(0,+T.range||0),items=[];
  for(const c of tPool()){let best=null;
    for(const k of c.vk){const m=c.v[k][0];if(!(m>0)||(!T.incl&&shaky(c,k)))continue;
      if(T.mode==='about'){if(Math.abs(m-target)<=rg&&(!best||Math.abs(m-target)<Math.abs(best.a-target)))best={c,k,a:m}}
      else if(m<=target&&(!best||m>best.a))best={c,k,a:m}}
    if(best)items.push(best)}
  items.sort((x,y)=>T.mode==='about'?Math.abs(x.a-target)-Math.abs(y.a-target)||y.a-x.a:y.a-x.a);
  T.results=items;
  box.innerHTML=`<p class="mu">${items.length} card${items.length===1?'':'s'} ${T.mode==='about'?`within ±${money(rg)} of ${money(target)}`:`up to ${money(target)}`} (Near Mint market price)</p><div class="grid">${items.slice(0,T.shown).map((x,n)=>`<div class="item"><a target="_blank" rel="noopener" href="${esc(link(x.c,x.k))}" style="color:inherit;text-decoration:none"><img src="${esc(x.c.img)}" loading="lazy" alt=""><b>${esc(x.c.name)}</b><div class="mu">${esc(x.c.set)}${x.c.lang==='jp'?'<span class="lang">JP</span>':''} #${esc(x.c.number)}<br>Near Mint · ${esc(x.k)}</div><div><span class="tag">${money(x.a)}</span></div></a><button class="chip" data-act="get" data-n="${n}" style="margin-top:6px;width:100%">＋ Get this</button></div>`).join('')}</div>${items.length>T.shown?'<button class="btn" data-act="more" style="margin-top:10px">Show more</button>':''}`}

// generic card picker (search by name, pick a printing)
async function tPick(cb){
  modal(`<h3>Add a card</h3><input id="tq" type="text" placeholder="Pokémon name (add a number like 4/102 if you want)" style="width:100%"><div class="row mu" style="align-items:center;flex-wrap:wrap">Show <button class="chip on" data-pl="en">English</button><button class="chip" data-pl="jp">Japanese</button><button class="chip" data-pl="both">Both</button></div><p class="mu" id="tpm">Loading cards…</p><div id="tpr"></div><button class="btn alt" id="tno" style="margin-top:8px">Cancel</button>`);
  $('#tno').onclick=()=>closeModal();
  let pl='en',list=[],t=null,shown=40;
  try{await loadData()}catch(e){$('#tpm').textContent=e.message;return}
  $('#tpm').textContent='Type a name to search.';
  const run=keep=>{if(!keep)shown=40;
    const toks=$('#tq').value.toLowerCase().replace(/[^a-z0-9é'\/ ]/g,' ').split(/\s+/).filter(Boolean);
    if(!toks.length){$('#tpr').innerHTML='';$('#tpm').textContent='Type a name to search.';return}
    const src=pl==='jp'?DATA.jp:pl==='both'?DATA.cards.concat(DATA.jp):DATA.cards;
    list=src.filter(c=>toks.every(w=>/\d/.test(w)?(c.number||'').toLowerCase().replace(/^0+(?=\d)/,'').includes(w.replace(/^0+(?=\d)/,'')):c.hay.includes(w)));
    list.sort((a,b)=>(a.hay.length-b.hay.length)||((b.d||'').localeCompare(a.d||'')));
    const L=list.slice(0,shown);
    $('#tpm').textContent=list.length?`${list.length} matches${list.length>shown?', showing '+shown:''}`:'No cards found.';
    $('#tpr').innerHTML=L.map((c,n)=>`<button class="item" data-n="${n}" style="display:flex;gap:10px;margin-bottom:8px;align-items:center"><img src="${esc(c.img)}" loading="lazy" alt="" style="width:56px;flex:0 0 56px"><div><b style="margin:0">${esc(c.name)}</b><div class="mu">${esc(c.set)}${c.lang==='jp'?'<span class="lang">JP</span>':''} · #${esc(c.number)}</div>${snip(c)}</div></button>`).join('')+(list.length>shown?'<button class="btn" id="tpmore" style="margin:4px 0 8px">Show more</button>':'');
    if($('#tpmore'))$('#tpmore').onclick=()=>{shown+=40;run(true)};
    document.querySelectorAll('#tpr .item').forEach(el=>el.onclick=()=>tChoose(L[el.dataset.n],cb))};
  $('#tq').oninput=()=>{clearTimeout(t);t=setTimeout(run,200)};
  document.querySelectorAll('#modal .chip[data-pl]').forEach(c=>c.onclick=async()=>{
    pl=c.dataset.pl;document.querySelectorAll('#modal .chip[data-pl]').forEach(x=>x.classList.toggle('on',x===c));
    if(pl!=='en'&&!DATA.jp.length){$('#tpm').textContent='Loading Japanese prices…';try{await loadJP()}catch(e){$('#tpm').textContent=e.message;pl='en';document.querySelectorAll('#modal .chip[data-pl]').forEach(x=>x.classList.toggle('on',x.dataset.pl==='en'));return}}
    run()});
  setTimeout(()=>{const q=$('#tq');if(q)q.focus()},50)}
function tChoose(c,cb){
  if(c.vk.length===1){closeModal();cb(c,c.vk[0]);return}
  modal(`<h3>${esc(c.name)}</h3><p class="mu">${esc(c.set)} · #${esc(c.number)}<br>Which printing? (Near Mint market price)</p>${c.vk.map((k,n)=>`<button class="btn alt" data-k="${n}" style="margin-bottom:8px">${esc(k)} · ${c.v[k][0]>0?money(c.v[k][0]):'no price'}${shaky(c,k)?' ⚠':''}</button>`).join('')}<button class="btn" id="tno2">Cancel</button>`);
  $('#tno2').onclick=()=>closeModal();
  document.querySelectorAll('#modal [data-k]').forEach(el=>el.onclick=()=>{closeModal();cb(c,c.vk[+el.dataset.k])})}

// scanning
function tThumb(img){const sc=96/Math.max(img.width,1),c=document.createElement('canvas');c.width=96;c.height=Math.max(1,Math.round(img.height*sc));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.6)}
async function tMatch(r){
  const lg=String(r.language||'').toLowerCase(),nm=String(r.name_english||r.name||'').trim();
  await loadData();let pool,foreign=false;
  if(/japan/.test(lg)){await loadJP();pool=DATA.jp}
  else if(/chin|korea|other/.test(lg)){foreign=true;try{await loadJP()}catch(e){}pool=DATA.cards.concat(DATA.jp)}
  else pool=DATA.cards;
  const num=r.number?String(r.number)+(r.set_total?'/'+r.set_total:''):'';
  let list=(nm||num)?search(nm,num,r.set_code||'',pool):[],exact=!!num;
  if(!list.length&&num&&nm){list=search(nm,'',r.set_code||'',pool);exact=false}
  if(!list.length&&nm.split(/\s+/).filter(Boolean).length>1){list=search(nm.split(/\s+/)[0],'',r.set_code||'',pool);exact=false}
  return {list,exact,foreign,nm,num}}
function tPairs(list){const out=[];for(const c of list){for(const k of c.vk){out.push({c,k});if(out.length>=14)return out}}return out}
async function tScanFiles(files){
  const arr=[...files];if(!arr.length)return;let done=0,added=0;
  for(const f of arr){
    T.msg=`Scanning ${done+1} of ${arr.length}…`;tRender();
    let thumb='';
    try{
      const img=await loadImg(f);thumb=tThumb(img);
      const r=await claudeRead(img),m=await tMatch(r);
      const label=(r.name_english||r.name||'?')+(r.number?' '+r.number+(r.set_total?'/'+r.set_total:''):'');
      if(m.list.length===1&&m.list[0].vk.length===1&&(m.exact||!m.num)&&!m.foreign){T.mine.push({i:m.list[0].i,k:m.list[0].vk[0]});added++}
      else if(!m.list.length){T.review.push({id:++T.rid,thumb,label,note:"No match found. Search by name or skip.",pairs:[]})}
      else T.review.push({id:++T.rid,thumb,label,note:m.foreign?"This language isn't on TCGplayer, so there's no exact price. Pick a similar card or skip.":(m.exact||!m.num)?'Which one is yours?':"Couldn't match the exact number. Pick the closest one:",pairs:tPairs(m.list)});
    }catch(err){T.review.push({id:++T.rid,thumb,label:"Couldn't read this card",note:String(err.message||err),pairs:[]})}
    done++;tSave()}
  T.msg=`Scanned ${arr.length}: ${added} added automatically${T.review.length?`, ${T.review.length} need a quick look`:''}.`;tRender()}

function tWire(){
  const f1=$('#tfile'),f2=$('#tfile2');
  if(f1)f1.onchange=()=>{const fs=[...f1.files];f1.value='';tScanFiles(fs)};
  if(f2)f2.onchange=()=>{const fs=[...f2.files];f2.value='';tScanFiles(fs)};
  const pct=$('#tpct');if(pct)pct.onchange=()=>{const n=parseFloat(pct.value);T.pct=n>0&&n<=200?n:100;tSave();tRender()};
  const inc=$('#tinc');if(inc)inc.onchange=()=>{T.incl=inc.checked;tSave();tRender()};
  const rg=$('#trng');if(rg)rg.oninput=()=>{T.range=parseFloat(rg.value)||0;T.shown=40;tResults()}}
$('#tradeView').addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act;
  if(act==='rm'){T[el.dataset.side].splice(+el.dataset.i,1);tSave();tRender()}
  else if(act==='addmine')tPick((c,k)=>{T.mine.push({i:c.i,k});tSave();tRender()});
  else if(act==='addtheirs')tPick((c,k)=>{T.theirs.push({i:c.i,k});tSave();tRender()});
  else if(act==='pct'){T.pct=+el.dataset.v;tSave();tRender()}
  else if(act==='tlang'){T.lang=el.dataset.v;T.shown=40;await tEnsure();tRender()}
  else if(act==='mode'){T.mode=el.dataset.v;T.shown=40;tRender()}
  else if(act==='rng'){T.range=+el.dataset.v;T.shown=40;tRender()}
  else if(act==='more'){T.shown+=40;tResults()}
  else if(act==='get'){const x=T.results[+el.dataset.n];if(x){T.theirs.push({i:x.c.i,k:x.k});tSave();tRender();window.scrollTo(0,0)}}
  else if(act==='skip'){T.review=T.review.filter(r=>r.id!==+el.dataset.r);tRender()}
  else if(act==='pair'){const rv=T.review.find(r=>r.id===+el.dataset.r);if(!rv)return;const p=rv.pairs[+el.dataset.p];T.mine.push({i:p.c.i,k:p.k});T.review=T.review.filter(r=>r!==rv);tSave();tRender()}
  else if(act==='manual'){const id=+el.dataset.r;tPick((c,k)=>{T.mine.push({i:c.i,k});T.review=T.review.filter(r=>r.id!==id);tSave();tRender()})}});
tLoad();

// ================= Fill a binder page from a photo, and share a page as an image =================
function bPhotoMenu(b){
  modal(`<h3>Fill page ${BD.page+1} from a photo</h3><p class="mu">Lay the page flat, fill the frame with just that page, and use good light with no glare. I'll read the ${b.cols*b.rows} pockets and fill the empty ones. Cards already in the page stay where they are.</p>
  <div class="cams"><label class="btn" for="pfile">📷 Take photo</label><label class="btn alt" for="pfile2">🖼️ Library</label></div>
  <input id="pfile" class="pick" type="file" accept="image/*" capture="environment"><input id="pfile2" class="pick" type="file" accept="image/*">
  <button class="btn alt" id="no" style="margin-top:8px">Cancel</button>`);
  $('#no').onclick=()=>closeModal();
  for(const id of ['#pfile','#pfile2']){const f=$(id);f.onchange=()=>{const file=f.files[0];f.value='';if(file)bPhotoFill(b,file)}}}

async function bPhotoFill(b,file){
  const pageIdx=BD.page,pg=b.pages[pageIdx],N=b.cols*b.rows;
  modal(`<h3>Reading your page…</h3><p class="mu">This takes a few seconds.</p>`);
  let cards;
  try{
    const img=await loadImg(file);
    const r=await claudeRead(img,{page:true,cols:b.cols,rows:b.rows});
    cards=Array.isArray(r.cards)?r.cards:[];
    if(!cards.length)throw new Error('I could not find any cards in that photo');
    await loadData();
    if(cards.some(c=>/japan|chin|korea|other/i.test(String(c.language||''))))try{await loadJP()}catch(e){}
  }catch(err){modal(`<h3>Couldn't read the page</h3><p class="mu">${esc(err.message||err)}</p><button class="btn" id="no">OK</button>`);$('#no').onclick=()=>closeModal();return}
  let placed=0,kept=0,empty=0;const review=[];
  for(const c of cards){
    const pos=parseInt(c.pos,10);if(!(pos>=1&&pos<=N))continue;
    if(c.empty||(!c.name&&!c.name_english&&!c.number)){empty++;continue}
    if(pg[pos-1]){kept++;continue}
    const m=await tMatch(c);const label=(c.name_english||c.name||'?')+(c.number?' '+c.number+(c.set_total?'/'+c.set_total:''):'');
    if(m.list.length===1&&m.list[0].vk.length===1&&(m.exact||!m.num)&&!m.foreign){const k=m.list[0].vk[0];pg[pos-1]={i:m.list[0].i,k,a:m.list[0].v[k][0]||0};placed++}
    else review.push({pos,label,note:!m.list.length?'No match found.':m.foreign?"This language isn't on TCGplayer, so there's no exact price. Pick a similar card:":'Which one is it?',pairs:tPairs(m.list).slice(0,8)})}
  bSave();bRender();
  const draw=()=>{
    modal(`<h3>Page read</h3><p class="mu">${placed} card${placed===1?'':'s'} placed${kept?` · ${kept} pocket${kept===1?'':'s'} already had a card`:''}${empty?` · ${empty} empty`:''}${review.length?` · ${review.length} need a quick look`:''}.</p>
    ${review.map((rv,ri)=>`<div class="review"><b>Pocket ${rv.pos}: ${esc(rv.label)}</b><div class="mu">${esc(rv.note)}</div>${rv.pairs.map((p,pi)=>`<button class="item pair" data-ri="${ri}" data-pi="${pi}"><img src="${esc(p.c.img)}" loading="lazy" alt=""><div style="flex:1;min-width:0"><b style="margin:0">${esc(p.c.name)}</b>${p.c.lang==='jp'?'<span class="lang">JP</span>':''}<div class="mu">${esc(p.c.set)} · #${esc(p.c.number)}<br>${esc(p.k)}</div></div><span class="tag">${p.c.v[p.k][0]>0?money(p.c.v[p.k][0]):'—'}</span></button>`).join('')}<div class="row"><button class="chip" data-skip="${ri}">Skip</button></div></div>`).join('')}
    <button class="btn" id="no" style="margin-top:8px">Done</button>`);
    $('#no').onclick=()=>closeModal();
    document.querySelectorAll('#modal .pair').forEach(el=>el.onclick=()=>{const rv=review[+el.dataset.ri],p=rv.pairs[+el.dataset.pi];pg[rv.pos-1]={i:p.c.i,k:p.k,a:p.c.v[p.k][0]||0};review.splice(+el.dataset.ri,1);placed++;bSave();bRender();draw()});
    document.querySelectorAll('#modal [data-skip]').forEach(el=>el.onclick=()=>{review.splice(+el.dataset.skip,1);draw()})};
  draw()}

// share a page as a picture
function bLoadCardImg(url){
  return new Promise(res=>{
    const tryProxy=()=>{fetch(SCAN_URL+'?img='+encodeURIComponent(url)).then(r=>r.ok?r.blob():Promise.reject()).then(bl=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=URL.createObjectURL(bl)}).catch(()=>res(null))};
    const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=tryProxy;i.src=url})}
async function bShareImage(b){
  modal(`<h3>Making your picture…</h3><p class="mu">One moment.</p>`);
  const pg=b.pages[BD.page],W=1080,pad=36,gap=18,head=150,foot=70,cw=Math.floor((W-pad*2-gap*(b.cols-1))/b.cols),ch=Math.round(cw*1.4);
  const H=head+b.rows*ch+(b.rows-1)*gap+foot+pad;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  const grad=g.createLinearGradient(0,0,W,H);grad.addColorStop(0,'#1b1048');grad.addColorStop(.55,'#0e0a2a');grad.addColorStop(1,'#10223d');g.fillStyle=grad;g.fillRect(0,0,W,H);
  g.fillStyle='#fff';g.textAlign='center';g.font='bold 54px system-ui,sans-serif';g.fillText(b.name,W/2,80);
  const own=pg.reduce((s,r)=>s+ownVal(r),0);
  g.font='28px system-ui,sans-serif';g.fillStyle='#7ff';g.fillText(`Page ${BD.page+1} of ${b.pages.length} · ${money(own)}`,W/2,125);
  const imgs=await Promise.all(pg.map(r=>{const c=r&&cardById(r.i);return c?bLoadCardImg(c.img):Promise.resolve(null)}));
  pg.forEach((r,i)=>{
    const x=pad+(i%b.cols)*(cw+gap),y=head+Math.floor(i/b.cols)*(ch+gap);
    g.fillStyle='rgba(255,255,255,.06)';g.strokeStyle='rgba(217,70,239,.5)';g.lineWidth=3;
    g.beginPath();g.roundRect?g.roundRect(x,y,cw,ch,14):g.rect(x,y,cw,ch);g.fill();g.stroke();
    const c=r&&cardById(r.i);if(!c)return;
    g.save();g.globalAlpha=r.w?.45:1;
    if(imgs[i])g.drawImage(imgs[i],x+4,y+4,cw-8,ch-8);
    else{g.fillStyle='#fff';g.font='bold 26px system-ui,sans-serif';g.textAlign='center';g.fillText(c.name.slice(0,18),x+cw/2,y+ch/2)}
    g.restore();
    const v=refVal(r);g.fillStyle='rgba(5,46,42,.92)';g.fillRect(x+4,y+ch-46,cw-8,42);g.fillStyle='#7ff';g.textAlign='center';g.font='bold 26px system-ui,sans-serif';g.fillText((r.w?'♡ ':'')+(v>0?money(v):'—'),x+cw/2,y+ch-16)});
  g.fillStyle='rgba(255,255,255,.6)';g.font='22px system-ui,sans-serif';g.textAlign='center';g.fillText('Binder Buddy · Near Mint market prices',W/2,H-30);
  let blob;try{blob=await new Promise((ok,no)=>cv.toBlob(x=>x?ok(x):no(new Error('no image')),'image/png'))}
  catch(e){modal(`<h3>Couldn't make the picture</h3><p class="mu">The card images could not be used by the browser. Try again later.</p><button class="btn" id="no">OK</button>`);$('#no').onclick=()=>closeModal();return}
  const url=URL.createObjectURL(blob),file=new File([blob],'binder-page.png',{type:'image/png'});
  modal(`<h3>Your page</h3><img src="${url}" alt="Binder page" style="width:100%;border-radius:10px"><p class="mu">Press and hold the picture to save it, or use the buttons.</p><button class="btn" id="sh">Share</button><a class="btn alt" id="dl" style="margin-top:8px;text-decoration:none" href="${url}" download="binder-page.png">Download</a><button class="btn alt" id="no" style="margin-top:8px">Close</button>`);
  $('#no').onclick=()=>closeModal();
  $('#sh').onclick=async()=>{try{if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:b.name});else $('#dl').click()}catch(e){}}}
bLoad();bCheckShared();
</script></body></html>
