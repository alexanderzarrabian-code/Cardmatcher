<script>
const $=s=>document.querySelector(s);

const status=t=>$('#status').textContent=t||'';
const money=v=>'$'+v.toFixed(2);
const S={f:{},card:null,v:null,alts:[],shown:60,list:[],incl:false,lang:'en',scanSet:'',note:''};
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.stpb');if(!b)return;const inp=b.parentElement.querySelector('input');if(!inp)return;
  const v=parseFloat(inp.value)||0,up=+b.dataset.dir>0,min=inp.min===''?0:+inp.min;
  let n=up?(v>=10?(Math.floor(v/5)+1)*5:Math.floor(v)+1):(v>10?(Math.ceil(v/5)-1)*5:Math.ceil(v)-1);
  n=Math.max(min,Math.round(n*100)/100);inp.value=n;inp.dispatchEvent(new Event('input',{bubbles:true}))});

// ---- Price data: prices.json is rebuilt every night by the GitHub job ----
const DATA={cards:[],jp:[],updated:'',jpUpdated:'',ready:null,jpReady:null};
const activeCards=()=>S.lang==='jp'?DATA.jp:S.lang==='both'?DATA.cards.concat(DATA.jp):DATA.cards;
function norm(c){
  c.lang=c.lang||'en';c.name=c.n;c.set=c.s;c.number=c.no||'';c.rarity=c.r||'';c.year=(c.d||'').slice(0,4);
  c.vk=Object.keys(c.v);
  const m=c.number.match(/^(.*?)\s*\/\s*(\d+)\s*$/);
  c.num=(m?m[1]:c.number).replace(/^0+(?=\d)/,'').toLowerCase();c.tot=m?+m[2]:0;
  c.hay=(c.n+' '+c.s).toLowerCase();c.type=c.t||'';
  c.url='https://www.tcgplayer.com/product/'+c.i;
  c.img=c.im||('https://tcgplayer-cdn.tcgplayer.com/product/'+c.i+'_200w.jpg');
  return c}
function loadData(){
  if(DATA.ready)return DATA.ready;
  DATA.ready=(async()=>{
    status('Loading card prices…');
    let r;try{r=await fetch('prices.json',{cache:'no-cache'})}catch(e){DATA.ready=null;throw new Error('Could not load the price file (check your connection).')}
    if(r.status===404){DATA.ready=null;throw new Error("The price file isn't built yet. On GitHub, open the Actions tab, run 'Update prices', then reload this page.")}
    if(!r.ok){DATA.ready=null;throw new Error('Could not load the price file ('+r.status+').')}
    const j=await r.json();DATA.cards=j.cards.map(c=>norm(c));DATA.updated=j.updated||'';status('');return DATA})();
  return DATA.ready}
function loadJP(){
  if(DATA.jpReady)return DATA.jpReady;
  DATA.jpReady=(async()=>{
    status('Loading Japanese prices…');
    let r;try{r=await fetch('prices_jp.json',{cache:'no-cache'})}catch(e){DATA.jpReady=null;throw new Error('Could not load Japanese prices (check your connection).')}
    if(r.status===404){DATA.jpReady=null;throw new Error("Japanese prices aren't built yet. On GitHub, open the Actions tab, run 'Update prices', wait for the green check, then reload.")}
    if(!r.ok){DATA.jpReady=null;throw new Error('Could not load Japanese prices ('+r.status+').')}
    const j=await r.json();DATA.jp=j.cards.map(c=>{c.lang='jp';return norm(c)});DATA.jpUpdated=j.updated||'';status('');return DATA})();
  return DATA.jpReady}
const needJP=()=>S.lang==='jp'||S.lang==='both';
async function setLang(l){
  const prev=S.lang;S.lang=l;
  document.querySelectorAll('.chip[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
  try{await loadData();if(needJP())await loadJP();status('')}
  catch(e){S.lang=prev;document.querySelectorAll('.chip[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===prev));status(e.message);return e.message}
  if(S.card){S.alts=[];findAlts();draw()}
  return ''}
document.querySelectorAll('.chip[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
const asOf=()=>DATA.updated?new Date(DATA.updated).toLocaleDateString():'unknown';
const mk=(c,k)=>c.v[k][0];
// Link that opens TCGplayer on this printing, Near Mint
const link=(c,k)=>c.url+'?Language=English&Printing='+encodeURIComponent(k).replace(/%20/g,'+')+'&Condition=Near+Mint';
// A price is 'uncertain' when market and lowest listing disagree by more than 3x (and it's not a cheap card)
const shaky=(c,k)=>{const v=c.v[k],m=v[0],l=v[1];return m>0&&l>0&&Math.max(m,l)>=40&&(l>3*m||m>3*l)};

const loadImg=f=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(f)});
function crop(img,x,y,w,h,outW,mode){
  const sw=img.width*w,sh=img.height*h,sc=outW/sw,c=document.createElement('canvas');
  c.width=outW;c.height=Math.max(1,Math.round(sh*sc));const g=c.getContext('2d');
  g.drawImage(img,img.width*x,img.height*y,sw,sh,0,0,c.width,c.height);
  const d=g.getImageData(0,0,c.width,c.height),px=d.data,L=new Float32Array(px.length/4);let sum=0;
  for(let i=0,j=0;i<px.length;i+=4,j++){L[j]=.3*px[i]+.59*px[i+1]+.11*px[i+2];sum+=L[j]}
  const mean=sum/L.length;
  for(let i=0,j=0;i<px.length;i+=4,j++){
    const l=L[j];let v;
    if(mode==='bin')v=l>mean*.8?255:0;            // dark text on light card
    else if(mode==='inv')v=l<mean*1.2?255:0;      // light text on dark card
    else v=Math.max(0,Math.min(255,(l-mean)*1.8+128));

const SCAN_URL='https://cardscan.alexanderzarrabian.workers.dev';
async function claudeRead(img,opt,retried){
  opt=opt||{};const maxd=opt.page?2000:1200;
  const sc=Math.min(1,maxd/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const b64=c.toDataURL('image/jpeg',opt.page?.82:.85).split(',')[1];
  const body={image:b64};if(opt.page){body.mode='page';body.cols=opt.cols;body.rows=opt.rows}
  const hdr={'content-type':'application/json'};let pass='';try{pass=localStorage.getItem('bb_pass')||''}catch(e){}if(pass)hdr['x-pass']=pass;
  const r=await fetch(SCAN_URL,{method:'POST',headers:hdr,body:JSON.stringify(body)});
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&j.error==='passcode'&&!retried){const p=window.prompt('Enter the app passcode to scan cards:');if(p){try{localStorage.setItem('bb_pass',p)}catch(e){}return claudeRead(img,opt,true)}}
  if(r.status===401&&j.error==='passcode')throw new Error('Wrong or missing passcode');
  if(!r.ok)throw new Error(j.error||('scan service error '+r.status));
  return j}
const SKIP=/^(basic|stage|hp|trainer|pokemon|pokémon|item|supporter|evolves|from|ability|attack)$/i;
const MODES=['gray','bin','inv'];
async function readNumber(w,img,dbg){
  for(const r of [[0,.87,1,.12],[0,.87,.5,.12],[.5,.87,.5,.12]])for(const mode of MODES){
    const cv=crop(img,...r,r[2]===1?1400:900,mode);
    const {data:{text}}=await w.recognize(cv);
    dbg.push(`number ${r[0]}/${r[2]} ${mode}: ${text.trim().replace(/\n/g,' ')}`);
    const m=text.match(/(\d{1,3})\s*[\/Il|]\s*(\d{2,3})/);
    if(m&&+m[2]>=10){dbg.cv=cv;return String(parseInt(m[1],10))+'/'+m[2]}}
  return ''}
async function readName(w,img,dbg){
  const votes={};
  for(const r of [[.04,.03,.72,.1],[.02,.02,.85,.14]])for(const mode of MODES){
    const {data:{text}}=await w.recognize(crop(img,...r,1200,mode));
    dbg.push(`name ${r[1]} ${mode}: ${text.trim().replace(/\n/g,' ')}`);
    for(const line of text.split('\n')){
      const ws=(line.match(/[A-Za-z]{3,}/g)||[]).filter(x=>!SKIP.test(x));
      if(ws.length){const k=ws[0].toLowerCase();votes[k]=(votes[k]||0)+1;break}}}
  const best=Object.entries(votes).sort((a,b)=>b[1]-a[1]||b[0].length-a[0].length)[0];
  return best?best[0][0].toUpperCase()+best[0].slice(1):''}
// Turns the scanner's answer into the search boxes + language setting. Returns the name to search.
async function applyScan(r){
  const lg=String(r.language||'').toLowerCase(),nm=(r.name_english||r.name||'').trim();
  let num=r.number?r.number+(r.set_total?'/'+r.set_total:''):'';
  S.note='';S.scanSet=r.set_code||'';
  if(/japan/.test(lg)){const er=await setLang('jp');if(er)S.note=er}
  else if(/chin|korea|other/.test(lg)){
    const er=await setLang('both');num='';S.scanSet='';
    S.note=(/chin/.test(lg)?'Chinese':/korea/.test(lg)?'Korean':'Non-English')+" card detected. TCGplayer doesn't list this language, so there's no price for the exact card. Showing matches for the same Pokémon instead."+(er?' ('+er+')':'')}
  else if(/engl/.test(lg)&&S.lang==='jp'){await setLang('en')}
  $('#name').value=nm;$('#num').value=num;
  return nm||num}
const onPick=async e=>{
  const f=e.target.files[0];if(!f)return;
  let scanErr='';
  try{status('Scanning your card…');const img0=await loadImg(f),r=await claudeRead(img0);
    const ok=await applyScan(r);
    $('#dbgtxt').textContent=JSON.stringify(r,null,1);
    if(ok){$('#go').click();return}
    scanErr='Scanner answered but could not read the card: '+JSON.stringify(r);status("Couldn't identify it. Trying the backup reader…")}
  catch(err){scanErr='SCAN SERVICE FAILED: '+err.message;status('Scan service unavailable ('+err.message+'). Trying the backup reader…')}
  if(!window.Tesseract){status('OCR failed to load. Type the name and number instead.');return}
  try{
    status('Reading card… this takes about 10 seconds.');
    const img=await loadImg(f),w=await Tesseract.createWorker('eng'),dbg=[];
    await w.setParameters({tessedit_pageseg_mode:'6',tessedit_char_whitelist:'0123456789/ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'});

    $('#dbgtxt').textContent=(scanErr?scanErr+'\n\n':'')+dbg.join('\n');if(scanErr){$('#dbgbox').style.display='';$('#dbgbox').open=true}
    const box=$('#dbgimg');box.innerHTML='';if(dbg.cv){dbg.cv.style.width='100%';box.appendChild(dbg.cv)}
    if(name||num){$('#go').click()}

  }catch(err){status('Could not read photo: '+err.message)}};
$('#file').onchange=onPick;$('#file2').onchange=onPick;



// ---- Browse by price ----
const B={items:[],shown:60,sort:'hi',f:{}};
document.querySelectorAll('.chip[data-bs]').forEach(b=>b.onclick=()=>{B.sort=b.dataset.bs;document.querySelectorAll('.chip[data-bs]').forEach(x=>x.classList.toggle('on',x===b));if(B.items.length)browseRun()});
$('#bgo').onclick=async()=>{
  B.f={};
  try{await loadData();if(needJP())await loadJP();status('');browseRun()}catch(err){status(err.message)}};
function browseRun(){
  S.card=null;
  const lo=parseFloat($('#bmin').value)||0,hiRaw=parseFloat($('#bmax').value),hi=isNaN(hiRaw)?Infinity:hiRaw,inc=$('#binc').checked;
  if(lo===0&&hi===Infinity&&!$('#bname').value.trim()){status('Enter a min and/or max price.');return}
  const words=$('#bname').value.toLowerCase().replace(/[^a-z0-9é' ]/g,' ').split(/\s+/).filter(Boolean);
  const items=[];
  for(const c of activeCards()){
    if(!words.every(w=>c.hay.includes(w)))continue;
    let best=null;
    for(const k of c.vk){const m=c.v[k][0];if(m>0&&m>=lo&&m<=hi&&(inc||!shaky(c,k))&&(!best||m>best.a))best={c,k,a:m}}
    if(best)items.push(best)}

  $('#bh').textContent=`${L.length}${L.length!==B.items.length?' of '+B.items.length:''} cards ${rng} (Near Mint market price)`;
  $('#bres').innerHTML=`<div class="grid">${L.slice(0,B.shown).map(x=>`<a class="item" target="_blank" rel="noopener" href="${esc(link(x.c,x.k))}"${ftAttr(x.c)}>${ftBadge(x.c)}<img src="${esc(x.c.img)}" loading="lazy" alt=""><b>${esc(x.c.name)}</b><div class="mu">${esc(x.c.set)}${x.c.lang==='jp'?'<span class="lang">JP</span>':''} #${esc(x.c.number)}<br>Near Mint · ${esc(x.k)}</div><div><span class="tag">${money(x.a)}</span>${shaky(x.c,x.k)?' <span class="warn">⚠ uncertain</span>':''}</div></a>`).join('')||'<p class="mu">No cards in this range.</p>'}</div>${L.length>B.shown?'<button class="btn" id="bmore" style="margin-top:10px">Show more</button>':''}`;
  if($('#bmore'))$('#bmore').onclick=()=>{B.shown+=60;browseDraw(lo,hi,true)}}

// ---- Filters (used by the similar-price list and Browse by price) ----
const ERAS=['Mega Evolution','Scarlet & Violet','Sword & Shield','Sun & Moon','XY','Black & White','Diamond & Pearl to HGSS','EX era','Classic (WOTC)','Promos & specials'];
const RAR_ORDER=['Common','Uncommon','Rare','Holo Rare','Double Rare','Ultra Rare','Illustration Rare','Special Illustration Rare','Hyper Rare','Secret Rare','Rare BREAK','Shiny Rare','Shiny Holo Rare','Radiant Rare','ACE SPEC Rare','Promo'];
function eraOf(c){
  if(c._e)return c._e;
  const sn=c.s||'',d=c.d||'',m=sn.match(/^([A-Za-z]+)\d*[A-Za-z]*\s*:/),px=m?m[1].toUpperCase():'';let e;
  if(px==='ME'||px==='MEE')e=ERAS[0];
  else if(px==='SV'||px==='SVE')e=ERAS[1];
  else if(px==='SWSH')e=ERAS[2];
  else if(/mega evolution/i.test(sn))e=ERAS[0];
  else if(/scarlet & violet/i.test(sn))e=ERAS[1];
  else if(/sword & shield/i.test(sn))e=ERAS[2];
  else if(/sun & moon/i.test(sn))e=ERAS[3];
  else if(/promo|pop series|mcdonald|trick or trade|battle academy|prize pack|world collection|vending|unnumbered|jumbo|black star/i.test(sn))e=ERAS[9];
  else if(d>='2020-02')e=ERAS[2];else if(d>='2017-02')e=ERAS[3];else if(d>='2014-02')e=ERAS[4];else if(d>='2011-04')e=ERAS[5];
  else if(d>='2007-05')e=ERAS[6];else if(d>='2003-06')e=ERAS[7];else e=ERAS[8];
  return c._e=e}
const F_KEYS=[['era','Era'],['rar','Rarity'],['type','Card type'],['pr','Printing'],['set','Set']];
const fVal=(x,k)=>k==='era'?eraOf(x.c):k==='rar'?(x.c.rarity||'Unknown'):k==='type'?x.c.type:k==='pr'?x.k:x.c.set;
function fApply(items,F,skip){
  const q=String(F.q||'').toLowerCase().replace(/[^a-z0-9é' ]/g,' ').split(/\s+/).filter(Boolean);
  return items.filter(x=>{for(const [k] of F_KEYS){if(k!==skip&&F[k]&&fVal(x,k)!==F[k])return false}
    return skip==='q'||!q.length||q.every(w=>(x.c.n||'').toLowerCase().includes(w))})}
function fOpts(items,F,k){
  const cnt=new Map(),dates=new Map();
  for(const x of fApply(items,F,k)){const v=fVal(x,k);if(!v)continue;cnt.set(v,(cnt.get(v)||0)+1);if(k==='set'&&!dates.has(v))dates.set(v,x.c.d||'')}
  if(F[k]&&!cnt.has(F[k]))cnt.set(F[k],0);
  let arr=[...cnt.entries()];
  if(k==='era')arr.sort((a,b)=>ERAS.indexOf(a[0])-ERAS.indexOf(b[0]));
  else if(k==='rar')arr.sort((a,b)=>{const ia=RAR_ORDER.indexOf(a[0]),ib=RAR_ORDER.indexOf(b[0]);return (ia<0?99:ia)-(ib<0?99:ib)||a[0].localeCompare(b[0])});
  else if(k==='set')arr.sort((a,b)=>(dates.get(b[0])||'').localeCompare(dates.get(a[0])||'')||a[0].localeCompare(b[0]));
  else arr.sort((a,b)=>a[0].localeCompare(b[0]));
  return arr}
const fCount=F=>[...F_KEYS.map(a=>a[0]),'q'].filter(k=>String(F[k]||'').trim()).length;

    const inp=host.querySelector('[data-fq]');let t=null;

  const hasType=items.some(x=>x.c.type);
  host.querySelector('.fsel').innerHTML=F_KEYS.filter(([k])=>k!=='type'||hasType).map(([k,label])=>`<label class="fl">${label}<select data-f="${k}"><option value="">All</option>${fOpts(items,F,k).map(([v,n])=>`<option value="${esc(v)}"${F[k]===v?' selected':''}>${esc(v)} (${n})</option>`).join('')}</select></label>`).join('');

function search(nameText,numText,setCode,pool){
  const words=nameText.toLowerCase().replace(/[^a-z0-9é' ]/g,' ').split(/\s+/).filter(Boolean);
  const m=numText.match(/([A-Za-z]*\d+)\s*(?:\/\s*(\d+))?/);
  const num=m?m[1].replace(/^0+(?=\d)/,'').toLowerCase():'',tot=m&&m[2]?+m[2]:0;
  let list=(pool||activeCards()).filter(c=>words.every(w=>c.hay.includes(w))&&(!num||c.num===num));
  if(tot){const t=list.filter(c=>c.tot===tot);if(t.length)list=t}
  if(setCode&&list.length>1){const sc=setCode.toLowerCase();const t=list.filter(c=>c.s.toLowerCase().includes(sc));if(t.length)list=t}
  list.sort((a,b)=>(a.hay.length-b.hay.length)||((b.d||'').localeCompare(a.d||'')));
  return list}

function findAlts(){
  const d=Math.max(1,+$('#range').value||5),lo=Math.max(0,S.budget-d),hi=S.budget+d;
  S.lo=lo;S.hi=hi;S.shown=60;S.alts=[];
  for(const c of activeCards()){
    if(c.i===S.card.i)continue;
    let best=null;
    for(const k of c.vk){if(!S.incl&&shaky(c,k))continue;const a=c.v[k][0];if(a>=lo&&a<=hi&&(!best||Math.abs(a-S.budget)<Math.abs(best.a-S.budget)))best={k,a}}
    if(best)S.alts.push({c,...best})}}

function draw(){
  const s=$('#sort').value,T=S.budget,a=fApply(S.alts,S.f);
  fRender($('#fbar'),S.f,S.alts,()=>{S.shown=60;draw()});
  a.sort(s==='lo'?(x,y)=>x.a-y.a:s==='hi'?(x,y)=>y.a-x.a:s==='az'?(x,y)=>x.c.name.localeCompare(y.c.name):(x,y)=>Math.abs(x.a-T)-Math.abs(y.a-T));

  $('#h').textContent=`${a.length}${a.length!==S.alts.length?' of '+S.alts.length:''} cards from ${money(S.lo)} to ${money(S.hi)} (Near Mint market price)`;

// export / import / share
function bExport(){
  const blob=new Blob([JSON.stringify({app:'binder-buddy',v:1,binders:BD.binders})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='binder-buddy-binders.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function bValid(b){return b&&typeof b.name==='string'&&Number.isInteger(b.cols)&&Number.isInteger(b.rows)&&b.cols>=1&&b.cols<=6&&b.rows>=1&&b.rows<=6&&Array.isArray(b.pages)&&b.pages.every(p=>Array.isArray(p))}
function bClean(b){
  const n=b.cols*b.rows;
  return {id:uid(),name:String(b.name).slice(0,40),cols:b.cols,rows:b.rows,pages:(b.pages.length?b.pages:[[]]).slice(0,200).map(p=>Array.from({length:n},(_,i)=>{const r=p[i];return r&&Number.isInteger(r.i)&&typeof r.k==='string'?Object.assign({i:r.i,k:r.k},r.w?{w:1}:{},Number.isFinite(r.a)?{a:r.a}:{}):null}))}}
function bWireImport(){
  const f=$('#bimpf'),btn=$('#bimp');if(!f)return;
  if(btn)btn.onclick=()=>f.click();
  f.onchange=async()=>{
    const file=f.files[0];if(!file)return;
    try{const j=JSON.parse(await file.text());const arr=(j.binders||[]).filter(bValid).map(bClean);
      if(!arr.length)throw new Error('empty');
      BD.binders.push(...arr);BD.cur=arr[0].id;BD.page=0;bSave();status('Imported '+arr.length+' binder'+(arr.length>1?'s':'')+'.');bRender(true)}
    catch(e){status("That file doesn't look like a Binder Buddy export.")}
    f.value=''}}
const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))));
function bShare(b){
  const url=location.origin+location.pathname+'#binder='+b64e(JSON.stringify({name:b.name,cols:b.cols,rows:b.rows,pages:b.pages}));

    try{await navigator.clipboard.writeText(url);$('#cp').textContent='Copied ✓'}catch(e){$('#blink').select();$('#cp').textContent='Press and hold the link to copy'}}}

// ---- drag & drop cards between pockets (press and hold, then drag) ----
const DR={st:null,block:false,b:null};
function drCleanup(){const st=DR.st;if(!st)return;clearTimeout(st.timer);clearTimeout(st.edgeT);if(st.ghost)st.ghost.remove();if(st.el)st.el.classList.remove('drag');document.querySelectorAll('.pk.over').forEach(x=>x.classList.remove('over'));DR.st=null}
function drPick(){const st=DR.st;if(!st||st.on)return;st.on=true;
  const r=st.el.getBoundingClientRect(),g=document.createElement('div');g.className='ghost';g.style.width=r.width+'px';g.style.height=r.height+'px';
  const im=st.el.querySelector('img');if(im)g.innerHTML='<img src="'+im.src+'" alt="">';document.body.appendChild(g);st.ghost=g;st.el.classList.add('drag');
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}
  drMoveGhost(st.x,st.y)}
function drMoveGhost(x,y){const st=DR.st;if(!st||!st.ghost)return;const w=st.ghost.offsetWidth,h=st.ghost.offsetHeight;st.ghost.style.left=(x-w/2)+'px';st.ghost.style.top=(y-h/2)+'px';
  const t=document.elementFromPoint?document.elementFromPoint(x,y):null,pk=t&&t.closest?t.closest('.pk'):null;
  document.querySelectorAll('.pk.over').forEach(e=>e.classList.remove('over'));
  const same=pk&&BD.page===st.sp&&+pk.dataset.i===st.si;if(pk&&!same)pk.classList.add('over');st.target=pk&&!same?pk:null;drEdge()}
// holding a dragged card at the left or right edge turns the page
function drEdge(){const st=DR.st;if(!st||!st.on)return;const W=window.innerWidth,z=44,side=st.x<z?-1:st.x>W-z?1:0;
  if(side===st.side)return;st.side=side;clearTimeout(st.edgeT);if(!side)return;
  const tick=()=>{const s2=DR.st,b=DR.b;if(!s2||s2.side!==side||!b)return;const np=BD.page+side;
    if(np>=0&&np<b.pages.length){BD.page=np;bRender();if(navigator.vibrate)try{navigator.vibrate(10)}catch(e){}drMoveGhost(s2.x,s2.y)}
    s2.edgeT=setTimeout(tick,750)};
  st.edgeT=setTimeout(tick,550)}
function drBegin(el,x,y,touch){if(BD.sel||DR.st)return;DR.st={el,x0:x,y0:y,x,y,on:false,touch,timer:null,target:null,sp:BD.page,si:+el.dataset.i,side:0};if(touch)DR.st.timer=setTimeout(drPick,230)}
function drMove(e){const st=DR.st;if(!st)return;const p=e.touches?e.touches[0]:e;if(!p)return;st.x=p.clientX;st.y=p.clientY;
  if(!st.on){if(Math.hypot(st.x-st.x0,st.y-st.y0)>10){if(st.touch){drCleanup()}else{drPick()}}return}
  if(e.cancelable)e.preventDefault();drMoveGhost(st.x,st.y)}
function drEnd(){const st=DR.st;if(!st)return;
  if(st.on){DR.block=true;setTimeout(()=>{DR.block=false},120);
    const b=DR.b,t=st.target;
    if(t&&b){const a=st.si,c=+t.dataset.i,sp=b.pages[st.sp],dp=b.pages[BD.page];const tmp=sp[a];sp[a]=dp[c];dp[c]=tmp;bSave();drCleanup();bRender();return}}
  drCleanup()}
document.addEventListener('touchmove',drMove,{passive:false});document.addEventListener('mousemove',drMove);
document.addEventListener('touchend',drEnd);document.addEventListener('touchcancel',drCleanup);document.addEventListener('mouseup',drEnd);
function bWireDrag(b){DR.b=b;document.querySelectorAll('.pk.has').forEach(el=>{
  el.addEventListener('touchstart',e=>{const p=e.touches[0];drBegin(el,p.clientX,p.clientY,true)},{passive:true});
  // after a page turn this pocket is removed from the page; the phone keeps sending the finger's events to it, so listen on it directly
  el.addEventListener('touchmove',drMove,{passive:false});el.addEventListener('touchend',drEnd);el.addEventListener('touchcancel',drCleanup);
  el.addEventListener('mousedown',e=>{if(e.button===0)drBegin(el,e.clientX,e.clientY,false)})})}

function tResults(){
  const box=$('#tres');if(!box)return;
  const a=tSum(T.mine),b=tSum(T.theirs),target=Math.max(0,a.val*T.pct/100-b.val);
  const fb=$('#tfbar');
  if(!T.mine.length){if(fb)fb.innerHTML='';box.innerHTML='<p class="mu">Add cards to your side to see what they could get you.</p>';return}
  if(target<=0){if(fb)fb.innerHTML='';box.innerHTML='<p class="mu">Nothing left to spend. Their side already covers your trade value.</p>';return}
  const rg=Math.max(0,+T.range||0),items=[];
  for(const c of tPool()){let best=null;
    for(const k of c.vk){const m=c.v[k][0];if(!(m>0)||(!T.incl&&shaky(c,k)))continue;
      if(T.mode==='about'){if(Math.abs(m-target)<=rg&&(!best||Math.abs(m-target)<Math.abs(best.a-target)))best={c,k,a:m}}
      else if(m<=target&&(!best||m>best.a))best={c,k,a:m}}
    if(best)items.push(best)}
  items.sort((x,y)=>T.mode==='about'?Math.abs(x.a-target)-Math.abs(y.a-target)||y.a-x.a:y.a-x.a);
  fRender(fb,T.f,items,()=>{T.shown=40;tResults()});WS_CUR=myWishSet();
  const all=items.length,L=fApply(items,T.f);items.length=0;items.push(...ftFirst(L));const nf=FT.by.size?FT.nf:0;
  T.results=items;
  box.innerHTML=`<p class="mu">${items.length}${items.length!==all?' of '+all:''} card${all===1?'':'s'} ${T.mode==='about'?`within ±${money(rg)} of ${money(target)}`:`up to ${money(target)}`} (Near Mint market price)</p><div class="grid">${items.slice(0,T.shown).map((x,n)=>(nf&&n===0?'<div class="gh">👥 From your friends\' lists ('+nf+')</div>':'')+(nf&&n===nf?'<div class="gh">Other cards</div>':'')+`<div class="item"><a target="_blank" rel="noopener" href="${esc(link(x.c,x.k))}"${ftAttr(x.c)} style="color:inherit;text-decoration:none">${ftBadge(x.c)}<img src="${esc(x.c.img)}" loading="lazy" alt=""><b>${esc(x.c.name)}</b><div class="mu">${esc(x.c.set)}${x.c.lang==='jp'?'<span class="lang">JP</span>':''} #${esc(x.c.number)}<br>Near Mint · ${esc(x.k)}</div><div><span class="tag">${money(x.a)}</span></div></a><button class="chip" data-act="get" data-n="${n}" style="margin-top:6px;width:100%">＋ Get this</button></div>`).join('')}</div>${items.length>T.shown?'<button class="btn" data-act="more" style="margin-top:10px">Show more</button>':''}`;WS_CUR=null}

// scanning
function tThumb(img){const sc=96/Math.max(img.width,1),c=document.createElement('canvas');c.width=96;c.height=Math.max(1,Math.round(img.height*sc));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.6)}
async function tMatch(r){
  const lg=String(r.language||'').toLowerCase(),nm=String(r.name_english||r.name||'').trim();
  await loadData();let pool,foreign=false;
  if(/japan/.test(lg)){await loadJP();pool=DATA.jp}
  else if(/chin|korea|other/.test(lg)){foreign=true;try{await loadJP()}catch(e){}pool=DATA.cards.concat(DATA.jp)}
  else pool=DATA.cards;
  const num=r.number?String(r.number)+(r.set_total?'/'+r.set_total:''):'';
  let list=(nm||num)?search(nm,num,r.set_code||'',pool):[],exact=!!num;
  if(!list.length&&num&&nm){list=search(nm,'',r.set_code||'',pool);exact=false}
  if(!list.length&&nm.split(/\s+/).filter(Boolean).length>1){list=search(nm.split(/\s+/)[0],'',r.set_code||'',pool);exact=false}
  return {list,exact,foreign,nm,num}}
function tPairs(list,cap){cap=cap||14;const out=[];for(const c of list){for(const k of c.vk){out.push({c,k});if(out.length>=cap)return out}}return out}
async function tScanFiles(files){
  const arr=[...files];if(!arr.length)return;let done=0,added=0;
  for(const f of arr){
    T.msg=`Scanning ${done+1} of ${arr.length}…`;tRender();
    let thumb='';
    try{
      const img=await loadImg(f);thumb=tThumb(img);
      const r=await claudeRead(img),m=await tMatch(r);
      const label=(r.name_english||r.name||'?')+(r.number?' '+r.number+(r.set_total?'/'+r.set_total:''):'');
      if(m.list.length===1&&m.list[0].vk.length===1&&(m.exact||!m.num)&&!m.foreign){tTarget().push({i:m.list[0].i,k:m.list[0].vk[0]});added++}
      else if(!m.list.length){T.review.push({id:++T.rid,thumb,label,note:"No match found. Search by name or skip.",pairs:[]})}
      else T.review.push({id:++T.rid,thumb,label,note:m.foreign?"This language isn't on TCGplayer, so there's no exact price. Pick a similar card or skip.":(m.exact||!m.num)?'Which one is yours?':"Couldn't match the exact number. Pick the closest one:",pairs:tPairs(m.list)});
    }catch(err){T.review.push({id:++T.rid,thumb,label:"Couldn't read this card",note:String(err.message||err),pairs:[]})}
    done++;tSave()}
  T.msg=`Scanned ${arr.length}: ${added} added automatically${T.review.length?`, ${T.review.length} need a quick look`:''}.`;tRender()}

// choose which printing a scanned card most likely is; sure=false means it was a guess
function pfPick(c,finish){
  const vk=c.vk;if(vk.length===1)return {k:vk[0],sure:true};
  const f=String(finish||'').toLowerCase();let hits=[];
  if(/reverse/.test(f))hits=vk.filter(k=>/reverse/i.test(k));
  else if(/holo|foil/.test(f))hits=vk.filter(k=>/holo/i.test(k)&&!/reverse/i.test(k));
  else if(/plain|non|normal|matte/.test(f))hits=vk.filter(k=>!/holo/i.test(k));
  if(hits.length===1)return {k:hits[0],sure:true};
  const pool=hits.length?hits:vk;
  return {k:pool.find(k=>!/holo/i.test(k))||pool.find(k=>!/reverse/i.test(k))||pool[0],sure:false}}
// use the set name the scan guessed to cut down same-name cards (only if it leaves something)
function pfNarrow(list,r){
  const w=String(r.set_name||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(x=>x.length>2&&!/^(the|and|set|tcg|pokemon)$/.test(x));
  if(list.length<2||!w.length)return list;
  const t=list.filter(c=>w.every(x=>c.s.toLowerCase().includes(x)));return t.length?t:list}
async function bPhotoFill(b,file){
  const pageIdx=BD.page,pg=b.pages[pageIdx],N=b.cols*b.rows;
  modal(`<h3>Reading your page…</h3><p class="mu">This takes a few seconds.</p>`);
  let cards;
  try{
    const img=await loadImg(file);
    const r=await claudeRead(img,{page:true,cols:b.cols,rows:b.rows});
    cards=Array.isArray(r.cards)?r.cards:[];
    if(!cards.length)throw new Error('I could not find any cards in that photo');
    await loadData();
    if(cards.some(c=>/japan|chin|korea|other/i.test(String(c.language||''))))try{await loadJP()}catch(e){}
  }catch(err){modal(`<h3>Couldn't read the page</h3><p class="mu">${esc(err.message||err)}</p><button class="btn" id="no">OK</button>`);$('#no').onclick=()=>closeModal();return}
  let placed=0,kept=0,empty=0,guessed=0;const review=[];
  for(const c of cards){
    const pos=parseInt(c.pos,10);if(!(pos>=1&&pos<=N))continue;
    if(c.empty||(!c.name&&!c.name_english&&!c.number)){empty++;continue}
    if(pg[pos-1]){kept++;continue}
    const m=await tMatch(c);if(!m.foreign)m.list=pfNarrow(m.list,c);const label=(c.name_english||c.name||'?')+(c.number?' '+c.number+(c.set_total?'/'+c.set_total:''):'');
    if(m.list.length===1&&(m.exact||!m.num)&&!m.foreign){const pk=pfPick(m.list[0],c.finish),k=pk.k;pg[pos-1]=Object.assign({i:m.list[0].i,k,a:m.list[0].v[k][0]||0},pk.sure?{}:{q:1});placed++;if(!pk.sure)guessed++}
    else{let pairs=tPairs(m.list,80);if(!m.foreign&&pairs.length){const f=pairs[0].c,best=pfPick(f,c.finish);pairs.sort((x,y)=>(x.c===f&&x.k===best.k?0:1)-(y.c===f&&y.k===best.k?0:1))}
      review.push({pos,label,finish:c.finish,note:!m.list.length?'No match found.':m.foreign?"This language isn't on TCGplayer, so there's no exact price. Pick a similar card:":'Best guess is first. Which one is it?',pairs,shown:8})}}
  bSave();bRender();
  const draw=()=>{
    modal(`<h3>Page read</h3><p class="mu">${placed} card${placed===1?'':'s'} placed${guessed?` (${guessed} marked <b style="color:#f59e0b">check</b>: I guessed the printing, tap them to confirm)`:''}${kept?` · ${kept} pocket${kept===1?'':'s'} already had a card`:''}${empty?` · ${empty} empty`:''}${review.length?` · ${review.length} need a quick look`:''}.</p>
    ${review.map((rv,ri)=>`<div class="review"><b>Pocket ${rv.pos}: ${esc(rv.label)}</b><div class="mu">${esc(rv.note)}</div>${rv.pairs.slice(0,rv.shown).map((p,pi)=>`<button class="item pair" data-ri="${ri}" data-pi="${pi}"><img src="${esc(p.c.img)}" loading="lazy" alt=""><div style="flex:1;min-width:0"><b style="margin:0">${esc(p.c.name)}</b>${p.c.lang==='jp'?'<span class="lang">JP</span>':''}<div class="mu">${esc(p.c.set)} · #${esc(p.c.number)}<br>${esc(p.k)}</div></div><span class="tag">${p.c.v[p.k][0]>0?money(p.c.v[p.k][0]):'—'}</span></button>`).join('')}<div class="row">${rv.pairs.length>rv.shown?`<button class="chip" data-more="${ri}">Show more (${rv.pairs.length-rv.shown} left)</button>`:''}<button class="chip" data-find="${ri}">🔍 Search for it</button><button class="chip" data-skip="${ri}">Skip</button></div></div>`).join('')}
    ${review.some(r=>r.pairs.length)?`<button class="btn alt" id="pfall" style="margin-top:8px">✨ Place all best guesses</button>`:''}
    <button class="btn" id="no" style="margin-top:8px">Done</button>`);
    $('#no').onclick=()=>closeModal();
    if($('#pfall'))$('#pfall').onclick=()=>{for(const rv of review.slice()){if(!rv.pairs.length)continue;const p=rv.pairs[0];pg[rv.pos-1]={i:p.c.i,k:p.k,a:p.c.v[p.k][0]||0,q:1};review.splice(review.indexOf(rv),1);placed++;guessed++}bSave();bRender();draw()};
    document.querySelectorAll('#modal .pair').forEach(el=>el.onclick=()=>{const rv=review[+el.dataset.ri],p=rv.pairs[+el.dataset.pi];pg[rv.pos-1]={i:p.c.i,k:p.k,a:p.c.v[p.k][0]||0};review.splice(+el.dataset.ri,1);placed++;bSave();bRender();draw()});
    document.querySelectorAll('#modal [data-more]').forEach(el=>el.onclick=()=>{const sc=document.querySelector('#modal .sheet').scrollTop;review[+el.dataset.more].shown+=12;draw();document.querySelector('#modal .sheet').scrollTop=sc});
    document.querySelectorAll('#modal [data-find]').forEach(el=>el.onclick=()=>{const rv=review[+el.dataset.find];tPick((c,k)=>{pg[rv.pos-1]={i:c.i,k,a:c.v[k][0]||0};const ix=review.indexOf(rv);if(ix>=0)review.splice(ix,1);placed++;bSave();bRender();setTimeout(draw,450)},draw)});
    document.querySelectorAll('#modal [data-skip]').forEach(el=>el.onclick=()=>{review.splice(+el.dataset.skip,1);draw()})};
  draw()}

// share a page as a picture
function bLoadCardImg(url){
  return new Promise(res=>{
    const tryProxy=()=>{fetch(SCAN_URL+'?img='+encodeURIComponent(url)).then(r=>r.ok?r.blob():Promise.reject()).then(bl=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=URL.createObjectURL(bl)}).catch(()=>res(null))};
    const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=tryProxy;i.src=url})}
async function bShareImage(b){
  modal(`<h3>Making your picture…</h3><p class="mu">One moment.</p>`);
  const pg=b.pages[BD.page],W=1080,pad=36,gap=18,head=150,foot=70,cw=Math.floor((W-pad*2-gap*(b.cols-1))/b.cols),ch=Math.round(cw*1.4);
  const H=head+b.rows*ch+(b.rows-1)*gap+foot+pad;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  const grad=g.createLinearGradient(0,0,W,H);grad.addColorStop(0,'#10192e');grad.addColorStop(.55,'#0a1020');grad.addColorStop(1,'#101a30');g.fillStyle=grad;g.fillRect(0,0,W,H);

  const imgs=await Promise.all(pg.map(r=>{const c=r&&cardById(r.i);return c?bLoadCardImg(c.img):Promise.resolve(null)}));
  pg.forEach((r,i)=>{
    const x=pad+(i%b.cols)*(cw+gap),y=head+Math.floor(i/b.cols)*(ch+gap);
    g.fillStyle='rgba(255,255,255,.06)';g.strokeStyle='rgba(245,197,66,.5)';g.lineWidth=3;
    g.beginPath();g.roundRect?g.roundRect(x,y,cw,ch,14):g.rect(x,y,cw,ch);g.fill();g.stroke();
    const c=r&&cardById(r.i);if(!c)return;
    g.save();g.globalAlpha=r.w?.45:1;
    if(imgs[i])g.drawImage(imgs[i],x+4,y+4,cw-8,ch-8);
    else{g.fillStyle='#fff';g.font='bold 26px system-ui,sans-serif';g.textAlign='center';g.fillText(c.name.slice(0,18),x+cw/2,y+ch/2)}
    g.restore();
    const v=refVal(r);g.fillStyle='rgba(6,28,22,.92)';g.fillRect(x+4,y+ch-46,cw-8,42);g.fillStyle='#6ee7b7';g.textAlign='center';g.font='bold 26px system-ui,sans-serif';g.fillText((r.w?'♡ ':'')+(v>0?money(v):'—'),x+cw/2,y+ch-16)});
  g.fillStyle='rgba(255,255,255,.6)';g.font='22px system-ui,sans-serif';g.textAlign='center';g.fillText('Binder Buddy · Near Mint market prices',W/2,H-30);
  let blob;try{blob=await new Promise((ok,no)=>cv.toBlob(x=>x?ok(x):no(new Error('no image')),'image/png'))}
  catch(e){modal(`<h3>Couldn't make the picture</h3><p class="mu">The card images could not be used by the browser. Try again later.</p><button class="btn" id="no">OK</button>`);$('#no').onclick=()=>closeModal();return}
  const url=URL.createObjectURL(blob),file=new File([blob],'binder-page.png',{type:'image/png'});
  modal(`<h3>Your page</h3><img src="${url}" alt="Binder page" style="width:100%;border-radius:10px"><p class="mu">Press and hold the picture to save it, or use the buttons.</p><button class="btn" id="sh">Share</button><a class="btn alt" id="dl" style="margin-top:8px;text-decoration:none" href="${url}" download="binder-page.png">Download</a><button class="btn alt" id="no" style="margin-top:8px">Close</button>`);
  $('#no').onclick=()=>closeModal();

const OF={to:'',kind:'offer',give:[],get:[],cash:0,note:'',counter:'',back:null,gopen:false,topen:true};
const OFK=x=>x.i+'|'+x.k;
const offVal=x=>{if(x.p>0)return x.p;const c=cardById(x.i);return c&&c.v[x.k]?Math.max(0,c.v[x.k][0]||0):0};
const offSum=a=>a.reduce((t,x)=>t+offVal(x),0);
const offStrip=a=>a.map(x=>{const o={i:x.i,k:x.k};if(x.p>0)o.p=x.p;return o});
function offerStart(to,o){o=o||{};
  Object.assign(OF,{to,kind:o.kind||'offer',give:o.give||[],get:o.get||[],cash:o.cash||0,note:'',counter:o.counter||'',gopen:false,topen:true,back:{view:FV.view,args:{handle:FV.handle,owner:FV.owner,id:FV.id}}});
  if(!ACC.handle){toast('Sign in on the Friends tab first');return}
  closeModal();setTimeout(()=>{showTab('friends');fvGo('offer')},o.fromModal?400:0)}
function offTot(){
  const g=offSum(OF.give),t=offSum(OF.get),c=OF.cash||0,mine=g+Math.max(0,c),theirs=t+Math.max(0,-c),d=mine-theirs;
  return `<b>You give ${money(mine)}</b>${c>0?` <span class="mu">(incl. ${money(c)} cash)</span>`:''} · <b>You get ${money(theirs)}</b>${c<0?` <span class="mu">(incl. ${money(-c)} cash)</span>`:''}<br><span class="mu">${!OF.give.length&&!OF.get.length?'Pick cards below.':Math.abs(d)<0.005?'Even trade.':d>0?`You are giving ${money(d)} more.`:`You are getting ${money(-d)} more.`}</span>`}
async function fvOffer(my){

  for(const x of OF.get)if(!seen.has(OFK(x))){seen.add(OFK(x));theirs.push(x)}
  const mine=[],s2=new Set();
  for(const l of T.lists)for(const x of l.items)if(!s2.has(OFK(x))){s2.add(OFK(x));mine.push({i:x.i,k:x.k,p:x.p||0})}

  const row=(x,side,arr)=>{const c=cardById(x.i);if(!c)return '';return `<label class="trow ofr"><input type="checkbox" data-ofs="${side}|${x.i}|${esc(x.k)}|${x.p||0}"${on(arr,x)?' checked':''}><img src="${esc(c.img)}" alt="" loading="lazy"><div style="flex:1;min-width:0"><b>${esc(c.name)}</b>${c.lang==='jp'?'<span class="lang">JP</span>':''}<div class="mu">${esc(c.set)} · ${esc(x.k)}</div></div><div class="tp">${money(offVal(x))}</div></label>`};

  <details class="fold" data-of="give"${OF.gopen?' open':''}><summary>You give${OF.kind==='request'&&!OF.counter?' (optional)':''} <span class="mu" id="ogvsum">${sideSum(OF.give)}</span></summary><div class="foldbody">${mine.length?mine.map(x=>row(x,'give',OF.give)).join(''):'<p class="mu">Nothing on your trade lists yet. Add cards by name, or build a list in the Trade tab.</p>'}
  <button class="btn alt" id="ofaddgive" style="margin:6px 0">＋ Add another card by name</button></div></details>
  <div class="panel"><div class="prow"><span>You add cash $</span><input id="ofc1" type="number" inputmode="decimal" min="0" step="0.5" value="${OF.cash>0?OF.cash:''}" placeholder="0"></div><div class="prow"><span>They add cash $</span><input id="ofc2" type="number" inputmode="decimal" min="0" step="0.5" value="${OF.cash<0?-OF.cash:''}" placeholder="0"></div></div>

const OFS={list:[]};
const STAT={pending:'⏳ Waiting',accepted:'✅ Agreed',declined:'✖ Declined',cancelled:'Cancelled',countered:'↩ Countered',completed:'🏁 Completed'};
function offItems(a){return a.length?a.map(x=>{const c=cardById(x.i);return c?`<div class="oi"><img src="${esc(c.img)}" alt="" loading="lazy"><span>${esc(c.name)}<span class="mu"> · ${esc(x.k)}</span></span><b>${money(offVal(x))}</b></div>`:''}).join(''):'<div class="mu">nothing</div>'}
function offerCard(o){
  const me=ACC.handle,mine=o.from===me,other=mine?o.to:o.from;
  const give=mine?o.give:o.get,get=mine?o.get:o.give,cash=mine?o.cash:-o.cash;
  const pend=o.status==='pending',agreed=o.status==='accepted';
  const btns=(pend&&!mine?`<button class="btn" data-oa="accept" data-id="${o.id}">Accept</button><div class="row"><button class="btn alt" data-oa="counter" data-id="${o.id}">Counter</button><button class="btn alt" data-oa="decline" data-id="${o.id}">Decline</button></div>`:'')
   +(pend&&mine?`<button class="btn alt" data-oa="cancel" data-id="${o.id}">Cancel this ${o.kind==='request'?'request':'offer'}</button>`:'')
   +(agreed?`<button class="btn" data-oa="complete" data-id="${o.id}">🏁 Mark trade completed</button><button class="btn alt" data-oa="cancel" data-id="${o.id}">✖ Cancel trade (it fell through)</button>`:'')
   +((pend||agreed||o.status==='completed')?`<button class="chip" data-oa="msg" data-id="${o.id}" style="margin-top:8px">💬 Message</button>`:'');
  return `<div class="ocard${o.unseen?' new':''}"><div class="row" style="align-items:center;justify-content:space-between;margin:0 0 6px"><b>${mine?'You → @'+esc(other):'@'+esc(other)+' → you'}</b><span><span class="tag">${o.kind==='request'?'🙋 Request':'🤝 Offer'}</span><span class="tag${agreed||o.status==='completed'?' hit':''}">${STAT[o.status]||o.status}</span>${o.unseen?'<span class="bell">new</span>':''}</span></div>
  <div class="mh" style="margin:6px 0 2px;font-size:13px">You give</div>${offItems(give)}${cash>0?`<div class="oi"><span>💵 Cash</span><b>${money(cash)}</b></div>`:''}
  <div class="mh" style="margin:6px 0 2px;font-size:13px">You get</div>${offItems(get)}${cash<0?`<div class="oi"><span>💵 Cash</span><b>${money(-cash)}</b></div>`:''}

  el.innerHTML=`<button class="chip" id="fvback">← Back</button><h3 style="margin-top:12px">Browse</h3>${tabs}${search}<div id="bbody"></div>`;
  $('#fvback').onclick=fvBack;
  document.querySelectorAll('#friendsView [data-bt]').forEach(b=>b.onclick=()=>{FV.btab=b.dataset.bt;fvRender()});
  const body=$('#bbody');
  const draw=()=>{
    const mine=new Set(T.lists.flatMap(x=>x.items).map(x=>x.i)),wish=myWishSet();
    if(tab==='binders'){
      body.innerHTML=r.binders.length?r.binders.map((b,i)=>`<button class="frow btnrow" data-i="${i}">${coverHtml(b.cover)}<div style="flex:1;min-width:0"><b>${esc(b.name)}</b><div class="mu">@${esc(b.owner)} · ${b.cnt} card${b.cnt===1?'':'s'} · ${ago(b.updated)}</div></div><span class="mu">›</span></button>`).join(''):'<p class="mu">No public binders yet. Be the first: set one of yours to Public from its ⋯ menu.</p>';
      document.querySelectorAll('#friendsView [data-i]').forEach(b=>b.onclick=()=>{const x=r.binders[+b.dataset.i];fvGo('binder',{owner:x.owner,id:x.id})});return}
    if(tab==='trade'){
      const owners=r.owners.map(o=>{const lists=o.lists.map(l=>({...l,items:l.items.filter(x=>nameOk(x.i))})).filter(l=>l.items.length);
        const n=lists.reduce((t,l)=>t+l.items.length,0),hits=lists.reduce((t,l)=>t+l.items.filter(x=>wish.has(x.i)).length,0);return {...o,lists,n,hits}}).filter(o=>o.n).sort((x,y)=>y.hits-x.hits||y.n-x.n);
      body.innerHTML=owners.length?owners.map(o=>`<details class="fold"${FV.bq||o.hits?' open':''}><summary>@${esc(o.owner)} <span class="mu">(${o.n} card${o.n===1?'':'s'}${o.hits?' · '+o.hits+' you want':''}${o.rel==='friend'?' · 👥':''})</span></summary><div class="foldbody">${o.lists.map(l=>`<div class="mu" style="margin:4px 0 6px"><b>${esc(l.name)}</b> · ${visLabel(l.vis)}</div>${l.items.map(x=>{const c=cardById(x.i),m=c&&c.v[x.k]?c.v[x.k][0]:0;return fvCardRow(x,`<span class="tag">${MODE_TXT[x.m]||'Trade or sale'}</span>${wish.has(x.i)?'<span class="tag hit">You want this ♡</span>':''}`,x.p>0?money(x.p)+'<br><span class="mu">asking</span>':(m>0?money(m):'—'))}).join('')}`).join('')}<button class="btn alt" data-prof="${esc(o.owner)}" style="margin-top:6px">Open @${esc(o.owner)}'s profile</button></div></details>`).join(''):`<p class="mu">${FV.bq?'No matches.':'No trade lists to show yet. Lists set to Public (or shared with friends) appear here.'}</p>`;
      document.querySelectorAll('#friendsView [data-prof]').forEach(b=>b.onclick=()=>fvGo('profile',{handle:b.dataset.prof}));return}
    const rows=r.wants.filter(x=>nameOk(x.i)).map(x=>({...x,has:mine.has(x.i)})).sort((x,y)=>(y.has-x.has)||(y.o.length-x.o.length));
    body.innerHTML=rows.length?rows.slice(0,150).map(x=>fvCardRow(x,`<span class="tag">♡ ${x.o.length}</span>${x.has?'<span class="tag hit">You have this</span>':''}<div class="mu" style="margin:2px 0">Wanted by ${x.o.slice(0,4).map(o=>'@'+esc(o)).join(', ')}${x.o.length>4?' +'+(x.o.length-4):''}</div>`)).join('')+(rows.length>150?'<p class="mu">Showing the first 150. Search to narrow down.</p>':''):`<p class="mu">${FV.bq?'No matches.':'No wishlist cards yet. Cards marked ♡ in Public binders and your friends binders show up here.'}</p>`};
  draw();
  const inp=$('#bq');if(inp){let t=null;inp.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{FV.bq=inp.value;draw()},200)}}}

const FVC={key:'',g:null,t:0};
async function fvBinder(my){
  const el=fvEl(),key=FV.owner+'/'+FV.id;
  if(!(FVC.g&&FVC.key===key&&Date.now()-FVC.t<30000)){
    el.innerHTML='<p class="mu">Loading…</p>';
    try{const g=await api('get_binder',{owner:FV.owner,id:FV.id});await loadData();
      if(g.data.pages.some(p=>p.some(r=>r&&!cardById(r.i)))&&!DATA.jp.length){try{await loadJP()}catch(e){}}
      FVC.key=key;FVC.g=g;FVC.t=Date.now()}
    catch(e){if(my!==FV.rid)return;fvErr(e.message);return}
    if(my!==FV.rid)return}
  const g=FVC.g,b=g.data,idx=Math.min(Math.max(FV.page,0),b.pages.length-1),pg=b.pages[idx];FV.page=idx;
  const pv=pg.reduce((s,r)=>s+ownVal(r),0),tv=b.pages.reduce((s,p)=>s+p.reduce((t,r)=>t+ownVal(r),0),0),wl=b.pages.reduce((s,p)=>s+p.reduce((t,r)=>t+wishVal(r),0),0);
  const cnt=b.pages.reduce((s,p)=>s+p.filter(r=>r&&!r.w).length,0),wc=b.pages.reduce((s,p)=>s+p.filter(r=>r&&r.w).length,0);
  el.innerHTML=`<button class="chip" id="fvback">← Back</button><h3 style="margin:12px 0 2px">${esc(g.name)}</h3><div class="mu">by @${esc(g.owner)} · ${visLabel(g.vis)} · updated ${ago(g.updated)}</div>
  <p class="btot"><b>Page ${money(pv)}</b> · Binder ${money(tv)} · ${cnt} card${cnt===1?'':'s'}${wc?`<br><span>♡ Wishlist ${money(wl)} · ${wc} card${wc===1?'':'s'}</span>`:''}</p>
  <div class="row" style="align-items:center;justify-content:center;gap:10px;margin:6px 0"><button class="chip" id="fbprev"${idx===0?' disabled':''}>◀</button><b>Page ${idx+1} of ${b.pages.length}</b><button class="chip" id="fbnext"${idx>=b.pages.length-1?' disabled':''}>▶</button></div>
  <div class="bgrid" style="grid-template-columns:repeat(${b.cols},1fr);max-width:${b.cols*98+16+(b.cols-1)*6}px">${pg.map((r,i)=>{
    const c=r&&cardById(r.i);
    if(!r)return '<div class="pk" style="cursor:default"></div>';
    if(!c)return '<div class="pk has"><span style="font-size:11px">card not found</span></div>';
    const val=c.v[r.k]?c.v[r.k][0]:0;
    return `<button class="pk has${r.w?' wish':''}" data-i="${i}"><img src="${esc(c.img)}" alt="${esc(c.name)}" loading="lazy">${r.w?'<span class="heart">♡</span>':''}<span class="pp">${val>0?money(val):'—'}${shaky(c,r.k)?' ⚠':''}</span></button>`}).join('')}</div>
  <p class="hint">♡ = looking for this card · Near Mint prices · ⚠ = uncertain</p>
  <button class="btn alt" id="fvcopy">Save a copy to my binders</button><button class="btn alt" id="fvlink" style="margin-top:8px">🔗 Share link to this binder</button>`;
  $('#fvback').onclick=fvBack;
  $('#fbprev').onclick=()=>{FV.page--;fvRender()};$('#fbnext').onclick=()=>{FV.page++;fvRender()};
  $('#fvlink').onclick=()=>shareUrl(binderLink(g.owner,FV.id),g.name+' on Binder Buddy');
  $('#fvcopy').onclick=()=>{const nb=bClean(b);nb.name=(g.name+' (from @'+g.owner+')').slice(0,40);BD.binders.push(nb);bSave();toast('Saved to your binders')};
  document.querySelectorAll('#friendsView .pk.has[data-i]').forEach(btn=>btn.onclick=()=>{
    const r=pg[+btn.dataset.i],c=r&&cardById(r.i);if(!c)return;
    modal(`<h3>${esc(c.name)}${r.w?' <span class="mu">♡ looking for this</span>':''}</h3><p class="mu">${esc(c.set)}${c.lang==='jp'?' · JP':''} · #${esc(c.number)}<br>Near Mint · ${esc(r.k)} · ${money(refVal(r))}</p><a class="btn alt" style="text-decoration:none" target="_blank" rel="noopener" href="${esc(link(c,r.k))}">Open on TCGplayer</a><button class="btn" id="no" style="margin-top:8px">Close</button>`);
    $('#no').onclick=()=>closeModal()})}

if(ACC.handle){api('me').then(m=>fvBadge(m.incoming.length,m.inbox,m.dm)).catch(()=>{});ftLoad(true)}

// ================= How it works, share links, deep links =================
const TOUR=[
 {tab:'binders',sel:'.tab[data-tab="binders"]',t:'📒 Your binders',d:'Build digital copies of your real binders and see what each page and the whole binder is worth at Near Mint prices.'},
 {tab:'binders',sel:'#bnew',alt:'.tab[data-tab="binders"]',t:'＋ Make a binder',d:'Start a binder here, then tap any empty pocket to add a card by name or photo. Hold and drag a card to rearrange.'},
 {tab:'binders',sel:'#bfill',alt:'#bnew',t:'📷 Fill a page from one photo',d:'Lay a real binder page flat, snap one photo, and every pocket is read for you. Cards it is unsure about are flagged to double-check.'},
 {tab:'binders',sel:'#bvis',alt:'#bnew',t:'👁 Who can see it',d:'Each binder is Private, Friends only or Public. Viewers see cards and prices, never what you paid.'},
 {tab:'binders',sel:'#bmore',alt:'#bnew',t:'⋯ More',d:'Rename the binder, change who can see it, copy a share link, or delete a page or the whole binder.'},
 {tab:'find',sel:'#go',alt:'.tab[data-tab="find"]',t:'🔍 Look up a card',d:'Scan or type a card to see its price and find other cards worth about the same. Handy for fair swaps.'},
 {tab:'trade',sel:'[data-act="tadd"]',alt:'.tab[data-tab="trade"]',t:'🔄 Your trade lists',d:'Tap ＋ Add to put cards on a list for trade or sale. Make a separate list for each card show or meetup. Tap a card for its details and price.'},
 {tab:'trade',sel:'.seg',alt:'.tab[data-tab="trade"]',t:'♡ Wishlist',d:'Switch to Wishlist to save cards you want. Friends can see it, and Matches tells you when a friend has one.'},
 {tab:'trade',sel:'details[data-fk="calc"]',alt:'.tab[data-tab="trade"]',t:'🧮 Trade math',d:'Open this to compare both sides of a trade. Pick 100, 90, 80 or 70% to count your cards at a discount.'},
 {tab:'friends',sel:'#fvstart',alt:'.tab[data-tab="friends"]',t:'👥 Friends',d:'Create a free account with email or Google, then add friends by handle. Look inside their binders and trade lists, and check 🎯 Matches for swaps that work for both of you.'},
 {tab:'friends',sel:'.tab[data-tab="friends"]',t:'🤝 Offers and requests',d:'On a friend\'s profile, tap Make an offer or Request a card. They can accept, counter or decline. If a deal falls through, either of you can cancel it.'},
 {tab:'msg',sel:'.tab[data-tab="msg"]',t:'💬 Messages',d:'Chat with friends to set up a meetup. Your offers and requests are in here too.'},
 {tab:'msg',sel:'#bellbtn',t:'🔔 Notifications',d:'Friend requests, offers waiting on you, replies and new matches all show up here. The number tells you how many are new.'},
 {tab:'msg',sel:'#themebtn',t:'🎨 Colors',d:'Pick a color theme that is easy on your eyes, or choose your own accent color.'}
];
const CH={i:0,from:'',on:false};
const cSleep=ms=>new Promise(r=>setTimeout(r,ms));
async function coachShow(i){
  CH.i=i;const st=TOUR[i],last=i===TOUR.length-1;
  let ov=$('#coach');if(!ov){ov=document.createElement('div');ov.id='coach';ov.innerHTML='<div id="coachhl"></div><div id="coachcard"></div>';document.body.appendChild(ov)}
  if(st.tab&&NAV.tab!==st.tab)showTab(st.tab);
  await cSleep(380);if(!CH.on)return;
  const el=document.querySelector(st.sel)||(st.alt&&document.querySelector(st.alt));
  const hl=$('#coachhl'),card=$('#coachcard');
  let r=null;
  if(el){try{if(!el.closest('.tabs')&&!el.closest('.banner'))el.scrollIntoView({block:'center'})}catch(e){}await cSleep(180);r=el.getBoundingClientRect();if(!(r.width>0&&r.height>0))r=null}
  if(r){Object.assign(hl.style,{display:'block',left:(r.left-6)+'px',top:(r.top-6)+'px',width:(r.width+12)+'px',height:(r.height+12)+'px',background:'transparent'})}
  else{Object.assign(hl.style,{display:'block',left:'50%',top:'50%',width:'0px',height:'0px'})}
  card.innerHTML=`<h3>${st.t}</h3><p class="mu">${st.d}</p><div class="crow"><span class="cn">${i+1} of ${TOUR.length}</span>${i>0?'<button class="btn alt" id="cback" style="flex:0 0 76px">Back</button>':'<button class="btn alt" id="cskip" style="flex:0 0 76px">Skip</button>'}<button class="btn" id="cnext" style="flex:0 0 96px">${last?'Done':'Next'}</button></div>`;
  const low=r&&(r.top+r.height/2)>window.innerHeight*0.5;
  card.style.top=low?'14px':'auto';card.style.bottom=low?'auto':'90px';
  $('#cnext').onclick=()=>{if(last)coachEnd();else coachShow(i+1)};
  if($('#cback'))$('#cback').onclick=()=>coachShow(i-1);
  if($('#cskip'))$('#cskip').onclick=coachEnd}
function coachEnd(){CH.on=false;const o=$('#coach');if(o)o.remove();try{localStorage.setItem('bb_seen','1')}catch(e){}if(CH.from&&NAV.tab!==CH.from)showTab(CH.from)}
function helpDlg(){closeModal();if(CH.on)return;CH.on=true;CH.from=NAV.tab||'binders';coachShow(0)}
function helpDone(){coachEnd()}
$('#helpbtn').onclick=()=>helpDlg();
function themeSave(t){try{localStorage.setItem('bb_theme',JSON.stringify(t))}catch(e){}themeApply(t)}
function themeDlg(){
  const cur=themeLoad();
  modal(`<h3>🎨 Colors</h3><div class="swg">${Object.keys(THEMES).map(k=>{const t=THEMES[k];return `<button class="sw${cur.k===k?' on':''}" data-th="${k}"><i style="background:${t.bg}"></i><i style="background:${t.surf}"></i><i style="background:${t.ac}"></i><br>${t.n}</button>`}).join('')}</div>
  <div class="panel"><div class="prow"><span>Your own accent color</span><input type="color" id="thc" value="${cur.ac||'#d9b45a'}" style="width:56px;height:40px;border:0;background:none;padding:0"></div><p class="mu" style="margin:6px 0 0">Keeps your current theme and swaps the highlight color.</p></div>
  <button class="btn mbtn" id="no">Done</button>`);
  $('#no').onclick=()=>closeModal();
  document.querySelectorAll('#modal [data-th]').forEach(b=>b.onclick=()=>{themeSave({k:b.dataset.th});themeDlg()});
  $('#thc').oninput=e=>{const c=themeLoad();themeSave({k:c.k==='custom'?(c.base||'gold'):c.k,base:c.k==='custom'?(c.base||'gold'):c.k,ac:e.target.value,custom:1})};
}
$('#themebtn').onclick=themeDlg;
function linkBase(){return location.origin+location.pathname}
async function shareUrl(url,title){
  try{if(navigator.share){await navigator.share({url,title});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(url);toast('Link copied')}catch(e){modal(`<h3>Copy this link</h3><input id="lk" type="text" readonly value="${esc(url)}" style="width:100%"><button class="btn" id="lkx" style="margin-top:10px">Close</button>`);$('#lk').select();$('#lkx').onclick=()=>closeModal()}}
const binderLink=(owner,id)=>linkBase()+'#b='+encodeURIComponent(owner)+'/'+encodeURIComponent(id);
const profileLink=h=>linkBase()+'#u='+encodeURIComponent(h);
function openDeepLink(){
  let m=location.hash.match(/^#b=([^/]+)\/(.+)$/);
  if(m){showTab('friends');fvGo('binder',{owner:decodeURIComponent(m[1]).toLowerCase(),id:decodeURIComponent(m[2])});return true}
  m=location.hash.match(/^#u=(.+)$/);
  if(m){showTab('friends');fvGo('profile',{handle:decodeURIComponent(m[1]).toLowerCase()});return true}
  return false}

bLoad();showTab('binders',true);bCheckShared();
if(!openDeepLink()){let seen=false;try{seen=!!localStorage.getItem('bb_seen')}catch(e){}if(!seen&&!location.hash&&!BD.binders.some(b=>b.pages.some(p=>p.some(Boolean)))&&!ACC.handle)setTimeout(()=>helpDlg(),700)}
</script></body></html>
