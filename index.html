<style>
:root{--bg:#0c1220;--fg:#eef1f7;--card:rgba(22,31,52,.85);--ac:#f5c542;--mu:#9aa6bf;--gold:#c99a2e;--blue:#f5c542;--line:#2f3e62;--aqua:#34d399;--shadow:0 3px 0 rgba(0,0,0,.35),0 0 14px rgba(245,197,66,.10)}

.banner h1{margin:0;font:900 26px/1.1 "Arial Black","Trebuchet MS",system-ui,sans-serif;letter-spacing:.5px;color:#f5c542;text-shadow:0 2px 0 rgba(0,0,0,.35)}

.spark:nth-child(1){right:18px;top:10px}.spark:nth-child(2){left:22px;top:30px;font-size:12px;animation-delay:.7s}.spark:nth-child(3){left:72px;top:10px;font-size:14px;animation-delay:1.3s}.spark:nth-child(4){right:64px;top:44px;font-size:11px;animation-delay:.3s}

.row{display:flex;gap:8px;margin:10px 0}

  background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#c99a2e,#3a4a70) border-box}

.lang{display:inline-block;background:#f43f5e;color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px}

label.mu{color:var(--mu)}

.tabs{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;z-index:20;display:flex;gap:8px;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:rgba(12,18,32,.94);border-top:2px solid var(--line);backdrop-filter:blur(6px)}.tab{flex:1;padding:10px 2px;border-radius:12px;border:2px solid var(--line);background:rgba(22,31,52,.9);color:var(--fg);font:800 13px system-ui;cursor:pointer}.tab.on{background:linear-gradient(135deg,#f5c542,#e0a82e);border-color:transparent;color:#1a1405}
.bgrid{display:grid;gap:6px;background:rgba(22,31,52,.6);border:3px solid var(--line);border-radius:14px;padding:8px;margin:8px 0}
.pk{position:relative;aspect-ratio:5/7;border:2px dashed var(--line);border-radius:8px;background:rgba(12,18,32,.6);padding:0;overflow:hidden;color:var(--mu);font-size:24px;cursor:pointer}
.pk.has{border:2px solid transparent}.pk.sel{outline:3px solid var(--ac)}.pk img{width:100%;height:100%;object-fit:cover;display:block}
.pk .qm{position:absolute;top:2px;right:3px;background:#f59e0b;color:#10192e;font:900 11px system-ui;border-radius:9px;padding:0 6px;box-shadow:0 0 6px #000}.pk .pp{position:absolute;left:0;right:0;bottom:0;background:rgba(6,28,22,.9);color:#6ee7b7;font:800 11px system-ui;text-align:center;padding:2px 0}
.chip:disabled{opacity:.35}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;overflow:auto}

#binderView select{flex:1;min-width:0}
.pk{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.pk.drag{opacity:.35}.pk.over{outline:3px solid var(--blue);box-shadow:0 0 14px var(--blue)}.ghost{position:fixed;z-index:60;pointer-events:none;border-radius:8px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.6),0 0 16px var(--ac);transform:scale(1.06) rotate(3deg);opacity:.95}.ghost img{width:100%;height:100%;object-fit:cover;display:block}
.cams{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.cams .btn{padding:12px 6px;font-size:16px}
.panel{background:rgba(22,31,52,.55);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:12px 0}

.prow #range,.prow #trng{flex:0 0 76px;width:76px;text-align:center;font-weight:800;padding:8px}.stp{display:flex;gap:6px;align-items:center}.stpb{width:42px;height:42px;border-radius:12px;border:2px solid var(--line);background:rgba(22,31,52,.9);color:var(--fg);font:800 22px system-ui;cursor:pointer;padding:0}.acts{display:flex;gap:8px;margin:6px 0 10px}.acts .chip{flex:1;padding:11px 4px;font-size:13px;text-align:center;border-radius:12px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.bsum{padding:9px;font-size:15px}
.btot{text-align:center;margin:6px 0;font-size:15px}.btot span{color:var(--mu);font-size:13px}
.bgrid{margin:8px auto}
.fbar{margin:8px 0;border:2px solid var(--line);border-radius:14px;background:rgba(22,31,52,.55);padding:0 12px}.fbar summary{cursor:pointer;font-weight:800;padding:11px 0;color:var(--ac);list-style:none}.fbar summary::-webkit-details-marker{display:none}.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:2px 0 10px}.fsel{display:contents}.fl{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px;min-width:0}.fl select,.fl input{width:100%;font-size:14px;padding:9px 8px;border-radius:10px}.fq{grid-column:1/-1}.ftags{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:10px}.ftags:empty{display:none}.hint{text-align:center;color:var(--mu);font-size:12px;margin:2px 0 8px}
.mbtn{margin-top:8px}
.trow{display:flex;gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
.trow img{width:46px;flex:0 0 46px;border-radius:5px}.trow b{font-size:15px}.trow .mu{font-size:12px}
.tp{font-weight:800;color:#6ee7b7;text-align:right;font-size:15px}.x{border:0;background:rgba(185,28,28,.85);color:#fff;border-radius:50%;width:30px;height:30px;font-size:14px;cursor:pointer;flex:0 0 30px}
.review{background:rgba(255,217,102,.08);border:2px solid #b8962f;border-radius:14px;padding:10px;margin-bottom:10px}
.pair{display:flex!important;gap:10px;align-items:center;margin-top:8px;text-align:left}.pair img{width:44px;flex:0 0 44px}
#tradeView .prow input[type=number]{flex:0 0 84px;width:84px;text-align:center;font-weight:800;padding:8px}
.pk.wish img{opacity:.42;filter:grayscale(.65)}.pk .heart{position:absolute;top:2px;left:4px;color:#f9a8d4;font-size:20px;text-shadow:0 0 6px #000}
.trend{display:flex;align-items:center;gap:10px;margin:2px 4px 6px}.trend svg{flex:1;height:34px}
.frow{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;width:100%;color:var(--fg);font:inherit;text-align:left}.btnrow{cursor:pointer}.cov{display:flex;gap:3px;flex:0 0 auto}.cov img{width:30px;border-radius:3px;background:#16213a}.code{font:700 17px ui-monospace,monospace;letter-spacing:1px;text-align:center;background:rgba(10,15,28,.85);border:2px dashed #c99a2e;border-radius:12px;padding:14px 6px;margin:10px 0;word-break:break-all;user-select:all}#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#f5c542;color:#1a1405;padding:10px 16px;border-radius:12px;font-weight:700;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86vw;text-align:center}#toast.show{opacity:1}
.tmeta{display:flex;gap:8px;align-items:center;margin:-4px 0 10px 4px;flex-wrap:wrap}.tmeta .chip{font-size:13px}.tpr{width:96px;padding:6px 8px;text-align:center;font-weight:800}
.tl{display:flex;gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;position:relative}.tl img{width:46px;flex:0 0 46px;border-radius:5px}.tl b{font-size:15px}.tl .mu{font-size:12px}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;margin-left:6px;background:var(--line);color:var(--fg)}.tag.hit{background:var(--aqua);color:#06281d}
.lbadge{position:absolute;top:2px;left:2px;z-index:2;background:var(--ac);color:#10192e;font-size:10px;font-weight:800;border-radius:999px;padding:1px 6px;box-shadow:0 0 6px #000}
details.fold{margin:10px 0}details.fold>summary{cursor:pointer;font-weight:800;font-size:17px;list-style:none;padding:12px 14px;background:var(--card);border:2px solid var(--line);border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}details.fold>summary::-webkit-details-marker{display:none}details.fold>summary::after{content:'▾';color:var(--mu)}details.fold[open]>summary::after{content:'▴'}details.fold[open]>summary{border-color:var(--ac)}.foldbody{padding-top:8px}
#helpbtn{position:absolute;right:14px;top:12px;width:32px;height:32px;border-radius:50%;border:2px solid var(--ac);background:transparent;color:var(--ac);font-weight:800;font-size:16px;cursor:pointer;z-index:2}
.hstep{text-align:center;padding:6px 4px}.hstep .big{font-size:46px;line-height:1.1}.hstep h3{margin:8px 0 6px}.hdots{display:flex;gap:6px;justify-content:center;margin:12px 0}.hdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.hdots i.on{background:var(--ac)}
.fbadge{position:absolute;top:4px;left:4px;z-index:2;background:var(--aqua);color:#06281d;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;box-shadow:0 0 6px #000}
.fbadge.want{background:var(--ac);color:#10192e}
.mbadge{position:absolute;top:2px;right:2px;z-index:3;font-size:10px;font-weight:800;border-radius:999px;padding:1px 6px;box-shadow:0 0 6px #000;max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbadge.want{background:var(--ac);color:#10192e}.mbadge.have{background:var(--aqua);color:#06281d}
.pk.match{border:2px solid var(--ac);box-shadow:0 0 12px rgba(245,197,66,.65)}
.tag.hot{background:var(--ac);color:#10192e}
.tl.hot{border-color:var(--ac)}
details.fold.match>summary{border-color:var(--ac);color:var(--ac)}
.panel.match{border-color:var(--aqua)}.panel.match:empty{display:none}
.mh{margin:12px 0 6px;font-size:15px}
.gh{grid-column:1/-1;font-weight:800;color:var(--ac);margin:8px 0 2px;font-size:15px}
.review.mt.have{border-color:var(--aqua)}.review.mt.want{border-color:var(--ac)}
.bell{background:var(--ac);color:#10192e;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:800;margin-left:6px}
</style></head><body>
<div class="banner"><span class="spark">✦</span><span class="spark">✦</span><span class="spark">✦</span><span class="spark">✦</span><button id="helpbtn" aria-label="How it works" title="How it works">?</button><h1>Binder Buddy</h1><p>Snap a card. Find its price twins.</p></div>
<div class="tabs"><button class="tab on" data-tab="binders">📒 Binders</button><button class="tab" data-tab="find">🔍 Look up</button><button class="tab" data-tab="trade">🔄 Trade</button><button class="tab" data-tab="friends">👥 Friends</button></div>
<div id="findView" hidden>
<p class="hint" style="margin:0 0 8px">Scan or type a card to see its price and find cards worth about the same.</p>
<div class="cams"><label class="btn" for="file">📷 Take photo</label>
<input id="file" class="pick" type="file" accept="image/*" capture="environment">
<label class="btn alt" for="file2">🖼️ Library</label></div>
<input id="file2" class="pick" type="file" accept="image/*">
<div class="row"><input id="name" type="text" placeholder="Card name"><input id="num" type="text" placeholder="e.g. 4/102"></div>
<button class="btn" id="go">Find price &amp; alternatives</button>
<details class="fold" id="fopt"><summary>⚙ Search options <span class="mu">language, price range</span></summary><div class="foldbody"><div class="panel"><div class="prow"><span>Cards</span><div class="chips"><button class="chip on" data-lang="en">English</button><button class="chip" data-lang="jp">Japanese</button><button class="chip" data-lang="both">Both</button></div></div>
<div class="prow"><span>Price range ± $</span><div class="stp"><button class="stpb" data-dir="-1" aria-label="Less">−</button><input id="range" type="number" inputmode="decimal" min="1" step="1" value="5"><button class="stpb" data-dir="1" aria-label="More">+</button></div></div></div></div></details>
<details class="mu" id="browse" style="margin-top:14px"><summary class="bsum">💰 Browse by price</summary>
<div class="row" style="margin-top:8px"><input id="bmin" type="number" inputmode="decimal" placeholder="Min $"><input id="bmax" type="number" inputmode="decimal" placeholder="Max $"></div>
<div class="row"><input id="bname" type="text" placeholder="Pokémon name (optional)"></div>
<div class="row mu" style="align-items:center;flex-wrap:wrap">Sort <button class="chip on" data-bs="hi">Price ↓</button><button class="chip" data-bs="lo">Price ↑</button><label style="margin-left:6px"><input type="checkbox" id="binc"> include uncertain</label></div>
<button class="btn" id="bgo">Show cards in this range</button></details>
<p class="mu" id="status"></p>
<details class="mu" id="dbgbox" style="display:none"><summary>What the scanner saw</summary><div id="dbgimg"></div><pre id="dbgtxt" style="white-space:pre-wrap;font-size:12px"></pre></details>
<div id="out"></div>
</div>
<div id="binderView"></div>
<div id="tradeView" hidden></div>
<div id="friendsView" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const status=t=>$('#status').textContent=t||'';
const money=v=>'$'+v.toFixed(2);
const S={f:{},card:null,v:null,alts:[],shown:60,list:[],incl:false,lang:'en',scanSet:'',note:''};
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.stpb');if(!b)return;const inp=b.parentElement.querySelector('input');if(!inp)return;
  const v=parseFloat(inp.value)||0,up=+b.dataset.dir>0,min=inp.min===''?0:+inp.min;
  let n=up?(v>=10?(Math.floor(v/5)+1)*5:Math.floor(v)+1):(v>10?(Math.ceil(v/5)-1)*5:Math.ceil(v)-1);
  n=Math.max(min,Math.round(n*100)/100);inp.value=n;inp.dispatchEvent(new Event('input',{bubbles:true}))});

// ---- Price data: prices.json is rebuilt every night by the GitHub job ----
const DATA={cards:[],jp:[],updated:'',jpUpdated:'',ready:null,jpReady:null};
const activeCards=()=>S.lang==='jp'?DATA.jp:S.lang==='both'?DATA.cards.concat(DATA.jp):DATA.cards;
function norm(c){
  c.lang=c.lang||'en';c.name=c.n;c.set=c.s;c.number=c.no||'';c.rarity=c.r||'';c.year=(c.d||'').slice(0,4);
  c.vk=Object.keys(c.v);
  const m=c.number.match(/^(.*?)\s*\/\s*(\d+)\s*$/);
  c.num=(m?m[1]:c.number).replace(/^0+(?=\d)/,'').toLowerCase();c.tot=m?+m[2]:0;
  c.hay=(c.n+' '+c.s).toLowerCase();c.type=c.t||'';
  c.url='https://www.tcgplayer.com/product/'+c.i;
  c.img=c.im||('https://tcgplayer-cdn.tcgplayer.com/product/'+c.i+'_200w.jpg');
  return c}
function loadData(){
  if(DATA.ready)return DATA.ready;
  DATA.ready=(async()=>{
    status('Loading card prices…');
    let r;try{r=await fetch('prices.json',{cache:'no-cache'})}catch(e){DATA.ready=null;throw new Error('Could not load the price file (check your connection).')}
    if(r.status===404){DATA.ready=null;throw new Error("The price file isn't built yet. On GitHub, open the Actions tab, run 'Update prices', then reload this page.")}
    if(!r.ok){DATA.ready=null;throw new Error('Could not load the price file ('+r.status+').')}
    const j=await r.json();DATA.cards=j.cards.map(c=>norm(c));DATA.updated=j.updated||'';status('');return DATA})();
  return DATA.ready}
function loadJP(){

const ERAS=['Mega Evolution','Scarlet & Violet','Sword & Shield','Sun & Moon','XY','Black & White','Diamond & Pearl to HGSS','EX era','Classic (WOTC)','Promos & specials'];
const RAR_ORDER=['Common','Uncommon','Rare','Holo Rare','Double Rare','Ultra Rare','Illustration Rare','Special Illustration Rare','Hyper Rare','Secret Rare','Rare BREAK','Shiny Rare','Shiny Holo Rare','Radiant Rare','ACE SPEC Rare','Promo'];
function eraOf(c){
  if(c._e)return c._e;
  const sn=c.s||'',d=c.d||'',m=sn.match(/^([A-Za-z]+)\d*[A-Za-z]*\s*:/),px=m?m[1].toUpperCase():'';let e;

  else if(px==='SWSH')e=ERAS[2];
  else if(/mega evolution/i.test(sn))e=ERAS[0];
  else if(/scarlet & violet/i.test(sn))e=ERAS[1];
  else if(/sword & shield/i.test(sn))e=ERAS[2];
  else if(/sun & moon/i.test(sn))e=ERAS[3];
  else if(/promo|pop series|mcdonald|trick or trade|battle academy|prize pack|world collection|vending|unnumbered|jumbo|black star/i.test(sn))e=ERAS[9];
  else if(d>='2020-02')e=ERAS[2];else if(d>='2017-02')e=ERAS[3];else if(d>='2014-02')e=ERAS[4];else if(d>='2011-04')e=ERAS[5];

function fApply(items,F,skip){

function search(nameText,numText,setCode,pool){
  const words=nameText.toLowerCase().replace(/[^a-z0-9é' ]/g,' ').split(/\s+/).filter(Boolean);
  const m=numText.match(/([A-Za-z]*\d+)\s*(?:\/\s*(\d+))?/);

  if(setCode&&list.length>1){const sc=setCode.toLowerCase();const t=list.filter(c=>c.s.toLowerCase().includes(sc));if(t.length)list=t}
  list.sort((a,b)=>(a.hay.length-b.hay.length)||((b.d||'').localeCompare(a.d||'')));
  return list}

async function bPicker(b,i){

// export / import / share
function bExport(){
  const blob=new Blob([JSON.stringify({app:'binder-buddy',v:1,binders:BD.binders})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='binder-buddy-binders.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function bValid(b){return b&&typeof b.name==='string'&&Number.isInteger(b.cols)&&Number.isInteger(b.rows)&&b.cols>=1&&b.cols<=6&&b.rows>=1&&b.rows<=6&&Array.isArray(b.pages)&&b.pages.every(p=>Array.isArray(p))}
function bClean(b){
  const n=b.cols*b.rows;
  return {id:uid(),name:String(b.name).slice(0,40),cols:b.cols,rows:b.rows,pages:(b.pages.length?b.pages:[[]]).slice(0,200).map(p=>Array.from({length:n},(_,i)=>{const r=p[i];return r&&Number.isInteger(r.i)&&typeof r.k==='string'?Object.assign({i:r.i,k:r.k},r.w?{w:1}:{},Number.isFinite(r.a)?{a:r.a}:{}):null}))}}
function bWireImport(){
  const f=$('#bimpf'),btn=$('#bimp');if(!f)return;
  if(btn)btn.onclick=()=>f.click();
  f.onchange=async()=>{
    const file=f.files[0];if(!file)return;
    try{const j=JSON.parse(await file.text());const arr=(j.binders||[]).filter(bValid).map(bClean);
      if(!arr.length)throw new Error('empty');
      BD.binders.push(...arr);BD.cur=arr[0].id;BD.page=0;bSave();status('Imported '+arr.length+' binder'+(arr.length>1?'s':'')+'.');bRender(true)}
    catch(e){status("That file doesn't look like a Binder Buddy export.")}
    f.value=''}}
const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))));
function bShare(b){
  const url=location.origin+location.pathname+'#binder='+b64e(JSON.stringify({name:b.name,cols:b.cols,rows:b.rows,pages:b.pages}));
  modal(`<h3>Share "${esc(b.name)}"</h3><p class="mu">Anyone who opens this link can add a copy of this binder to their own app.</p><input id="blink" type="text" readonly value="${esc(url)}" style="width:100%"><button class="btn" id="cp" style="margin-top:10px">Copy link</button><button class="btn alt" id="no" style="margin-top:8px">Close</button>`);
  $('#no').onclick=()=>closeModal();$('#blink').onfocus=e=>e.target.select();
  $('#cp').onclick=async()=>{try{if(navigator.share){await navigator.share({title:'Binder Buddy: '+b.name,url});return}}catch(e){if(e&&e.name==='AbortError')return}
    try{await navigator.clipboard.writeText(url);$('#cp').textContent='Copied ✓'}catch(e){$('#blink').select();$('#cp').textContent='Press and hold the link to copy'}}}
function bCheckShared(){
  const m=location.hash.match(/^#binder=(.+)$/);if(!m)return;
  try{const b=JSON.parse(b64d(m[1]));if(!bValid(b))throw 0;const nb=bClean(b);
    showTab('binders');
    modal(`<h3>Add shared binder?</h3><p class="mu">"${esc(nb.name)}" · ${nb.pages.length} page${nb.pages.length>1?'s':''}, ${nb.pages.reduce((s,p)=>s+p.filter(Boolean).length,0)} cards</p><button class="btn" id="ok">Add to my binders</button><button class="btn alt" id="no" style="margin-top:8px">No thanks</button>`);
    const done=()=>{history.replaceState(null,'',location.pathname+location.search);closeModal()};
    $('#no').onclick=done;$('#ok').onclick=()=>{BD.binders.push(nb);BD.cur=nb.id;BD.page=0;bSave();done();bRender(true)}}
  catch(e){history.replaceState(null,'',location.pathname+location.search)}}

// ---- drag & drop cards between pockets (press and hold, then drag) ----
const DR={st:null,block:false,b:null};
function drCleanup(){const st=DR.st;if(!st)return;clearTimeout(st.timer);clearTimeout(st.edgeT);if(st.ghost)st.ghost.remove();if(st.el)st.el.classList.remove('drag');document.querySelectorAll('.pk.over').forEach(x=>x.classList.remove('over'));DR.st=null}
function drPick(){const st=DR.st;if(!st||st.on)return;st.on=true;
  const r=st.el.getBoundingClientRect(),g=document.createElement('div');g.className='ghost';g.style.width=r.width+'px';g.style.height=r.height+'px';
  const im=st.el.querySelector('img');if(im)g.innerHTML='<img src="'+im.src+'" alt="">';document.body.appendChild(g);st.ghost=g;st.el.classList.add('drag');
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}
  drMoveGhost(st.x,st.y)}
function drMoveGhost(x,y){const st=DR.st;if(!st||!st.ghost)return;const w=st.ghost.offsetWidth,h=st.ghost.offsetHeight;st.ghost.style.left=(x-w/2)+'px';st.ghost.style.top=(y-h/2)+'px';
  const t=document.elementFromPoint?document.elementFromPoint(x,y):null,pk=t&&t.closest?t.closest('.pk'):null;
  document.querySelectorAll('.pk.over').forEach(e=>e.classList.remove('over'));
  const same=pk&&BD.page===st.sp&&+pk.dataset.i===st.si;if(pk&&!same)pk.classList.add('over');st.target=pk&&!same?pk:null;drEdge()}
// holding a dragged card at the left or right edge turns the page
function drEdge(){const st=DR.st;if(!st||!st.on)return;const W=window.innerWidth,z=44,side=st.x<z?-1:st.x>W-z?1:0;
  if(side===st.side)return;st.side=side;clearTimeout(st.edgeT);if(!side)return;
  const tick=()=>{const s2=DR.st,b=DR.b;if(!s2||s2.side!==side||!b)return;const np=BD.page+side;
    if(np>=0&&np<b.pages.length){BD.page=np;bRender();if(navigator.vibrate)try{navigator.vibrate(10)}catch(e){}drMoveGhost(s2.x,s2.y)}
    s2.edgeT=setTimeout(tick,750)};
  st.edgeT=setTimeout(tick,550)}
function drBegin(el,x,y,touch){if(BD.sel||DR.st)return;DR.st={el,x0:x,y0:y,x,y,on:false,touch,timer:null,target:null,sp:BD.page,si:+el.dataset.i,side:0};if(touch)DR.st.timer=setTimeout(drPick,230)}
function drMove(e){const st=DR.st;if(!st)return;const p=e.touches?e.touches[0]:e;if(!p)return;st.x=p.clientX;st.y=p.clientY;
  if(!st.on){if(Math.hypot(st.x-st.x0,st.y-st.y0)>10){if(st.touch){drCleanup()}else{drPick()}}return}
  if(e.cancelable)e.preventDefault();drMoveGhost(st.x,st.y)}
function drEnd(){const st=DR.st;if(!st)return;
  if(st.on){DR.block=true;setTimeout(()=>{DR.block=false},120);
    const b=DR.b,t=st.target;
    if(t&&b){const a=st.si,c=+t.dataset.i,sp=b.pages[st.sp],dp=b.pages[BD.page];const tmp=sp[a];sp[a]=dp[c];dp[c]=tmp;bSave();drCleanup();bRender();return}}
  drCleanup()}
document.addEventListener('touchmove',drMove,{passive:false});document.addEventListener('mousemove',drMove);
document.addEventListener('touchend',drEnd);document.addEventListener('touchcancel',drCleanup);document.addEventListener('mouseup',drEnd);
function bWireDrag(b){DR.b=b;document.querySelectorAll('.pk.has').forEach(el=>{
  el.addEventListener('touchstart',e=>{const p=e.touches[0];drBegin(el,p.clientX,p.clientY,true)},{passive:true});
  // after a page turn this pocket is removed from the page; the phone keeps sending the finger's events to it, so listen on it directly
  el.addEventListener('touchmove',drMove,{passive:false});el.addEventListener('touchend',drEnd);el.addEventListener('touchcancel',drCleanup);
  el.addEventListener('mousedown',e=>{if(e.button===0)drBegin(el,e.clientX,e.clientY,false)})})}

  <div id="tfbar"></div><div id="tres"></div>`,false)}`;

function tResults(){
  const box=$('#tres');if(!box)return;
  const a=tSum(T.mine),b=tSum(T.theirs),target=Math.max(0,a.val*T.pct/100-b.val);
  const fb=$('#tfbar');
  if(!T.mine.length){if(fb)fb.innerHTML='';box.innerHTML='<p class="mu">Add cards to your side to see what they could get you.</p>';return}
  if(target<=0){if(fb)fb.innerHTML='';box.innerHTML='<p class="mu">Nothing left to spend. Their side already covers your trade value.</p>';return}
  const rg=Math.max(0,+T.range||0),items=[];
  for(const c of tPool()){let best=null;
    for(const k of c.vk){const m=c.v[k][0];if(!(m>0)||(!T.incl&&shaky(c,k)))continue;
      if(T.mode==='about'){if(Math.abs(m-target)<=rg&&(!best||Math.abs(m-target)<Math.abs(best.a-target)))best={c,k,a:m}}
      else if(m<=target&&(!best||m>best.a))best={c,k,a:m}}
    if(best)items.push(best)}
  items.sort((x,y)=>T.mode==='about'?Math.abs(x.a-target)-Math.abs(y.a-target)||y.a-x.a:y.a-x.a);
  fRender(fb,T.f,items,()=>{T.shown=40;tResults()});WS_CUR=myWishSet();
  const all=items.length,L=fApply(items,T.f);items.length=0;items.push(...ftFirst(L));const nf=FT.by.size?FT.nf:0;
  T.results=items;
  box.innerHTML=`<p class="mu">${items.length}${items.length!==all?' of '+all:''} card${all===1?'':'s'} ${T.mode==='about'?`within ±${money(rg)} of ${money(target)}`:`up to ${money(target)}`} (Near Mint market price)</p><div class="grid">${items.slice(0,T.shown).map((x,n)=>(nf&&n===0?'<div class="gh">👥 From your friends\' lists ('+nf+')</div>':'')+(nf&&n===nf?'<div class="gh">Other cards</div>':'')+`<div class="item"><a target="_blank" rel="noopener" href="${esc(link(x.c,x.k))}"${ftAttr(x.c)} style="color:inherit;text-decoration:none">${ftBadge(x.c)}<img src="${esc(x.c.img)}" loading="lazy" alt=""><b>${esc(x.c.name)}</b><div class="mu">${esc(x.c.set)}${x.c.lang==='jp'?'<span class="lang">JP</span>':''} #${esc(x.c.number)}<br>Near Mint · ${esc(x.k)}</div><div><span class="tag">${money(x.a)}</span></div></a><button class="chip" data-act="get" data-n="${n}" style="margin-top:6px;width:100%">＋ Get this</button></div>`).join('')}</div>${items.length>T.shown?'<button class="btn" data-act="more" style="margin-top:10px">Show more</button>':''}`;WS_CUR=null}

// generic card picker (search by name, pick a printing)
async function tPick(cb,back){
  modal(`<h3>Add a card</h3><input id="tq" type="text" placeholder="Pokémon name (add a number like 4/102 if you want)" style="width:100%"><div class="row mu" style="align-items:center;flex-wrap:wrap">Show <button class="chip on" data-pl="en">English</button><button class="chip" data-pl="jp">Japanese</button><button class="chip" data-pl="both">Both</button></div><p class="mu" id="tpm">Loading cards…</p><div id="tpr"></div><button class="btn alt" id="tno" style="margin-top:8px">Cancel</button>`);
  $('#tno').onclick=()=>{closeModal();if(back)setTimeout(back,450)};
  let pl='en',list=[],t=null,shown=40;
  try{await loadData()}catch(e){$('#tpm').textContent=e.message;return}
  $('#tpm').textContent='Type a name to search.';
  const run=keep=>{if(!keep)shown=40;
    const toks=$('#tq').value.toLowerCase().replace(/[^a-z0-9é'\/ ]/g,' ').split(/\s+/).filter(Boolean);
    if(!toks.length){$('#tpr').innerHTML='';$('#tpm').textContent='Type a name to search.';return}
    const src=pl==='jp'?DATA.jp:pl==='both'?DATA.cards.concat(DATA.jp):DATA.cards;
    list=src.filter(c=>toks.every(w=>/\d/.test(w)?(c.number||'').toLowerCase().replace(/^0+(?=\d)/,'').includes(w.replace(/^0+(?=\d)/,'')):c.hay.includes(w)));
    list.sort((a,b)=>(a.hay.length-b.hay.length)||((b.d||'').localeCompare(a.d||'')));

// scanning
function tThumb(img){const sc=96/Math.max(img.width,1),c=document.createElement('canvas');c.width=96;c.height=Math.max(1,Math.round(img.height*sc));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.6)}
async function tMatch(r){
  const lg=String(r.language||'').toLowerCase(),nm=String(r.name_english||r.name||'').trim();
  await loadData();let pool,foreign=false;
  if(/japan/.test(lg)){await loadJP();pool=DATA.jp}
  else if(/chin|korea|other/.test(lg)){foreign=true;try{await loadJP()}catch(e){}pool=DATA.cards.concat(DATA.jp)}
  else pool=DATA.cards;
  const num=r.number?String(r.number)+(r.set_total?'/'+r.set_total:''):'';
  let list=(nm||num)?search(nm,num,r.set_code||'',pool):[],exact=!!num;
  if(!list.length&&num&&nm){list=search(nm,'',r.set_code||'',pool);exact=false}
  if(!list.length&&nm.split(/\s+/).filter(Boolean).length>1){list=search(nm.split(/\s+/)[0],'',r.set_code||'',pool);exact=false}
  return {list,exact,foreign,nm,num}}
function tPairs(list,cap){cap=cap||14;const out=[];for(const c of list){for(const k of c.vk){out.push({c,k});if(out.length>=cap)return out}}return out}
async function tScanFiles(files){
  const arr=[...files];if(!arr.length)return;let done=0,added=0;
  for(const f of arr){
    T.msg=`Scanning ${done+1} of ${arr.length}…`;tRender();
    let thumb='';
    try{
      const img=await loadImg(f);thumb=tThumb(img);
      const r=await claudeRead(img),m=await tMatch(r);
      const label=(r.name_english||r.name||'?')+(r.number?' '+r.number+(r.set_total?'/'+r.set_total:''):'');
      if(m.list.length===1&&m.list[0].vk.length===1&&(m.exact||!m.num)&&!m.foreign){T.mine.push({i:m.list[0].i,k:m.list[0].vk[0]});added++}
      else if(!m.list.length){T.review.push({id:++T.rid,thumb,label,note:"No match found. Search by name or skip.",pairs:[]})}
      else T.review.push({id:++T.rid,thumb,label,note:m.foreign?"This language isn't on TCGplayer, so there's no exact price. Pick a similar card or skip.":(m.exact||!m.num)?'Which one is yours?':"Couldn't match the exact number. Pick the closest one:",pairs:tPairs(m.list)});
    }catch(err){T.review.push({id:++T.rid,thumb,label:"Couldn't read this card",note:String(err.message||err),pairs:[]})}
    done++;tSave()}
  T.msg=`Scanned ${arr.length}: ${added} added automatically${T.review.length?`, ${T.review.length} need a quick look`:''}.`;tRender()}

// choose which printing a scanned card most likely is; sure=false means it was a guess
function pfPick(c,finish){
  const vk=c.vk;if(vk.length===1)return {k:vk[0],sure:true};
  const f=String(finish||'').toLowerCase();let hits=[];
  if(/reverse/.test(f))hits=vk.filter(k=>/reverse/i.test(k));
  else if(/holo|foil/.test(f))hits=vk.filter(k=>/holo/i.test(k)&&!/reverse/i.test(k));
  else if(/plain|non|normal|matte/.test(f))hits=vk.filter(k=>!/holo/i.test(k));
  if(hits.length===1)return {k:hits[0],sure:true};
  const pool=hits.length?hits:vk;
  return {k:pool.find(k=>!/holo/i.test(k))||pool.find(k=>!/reverse/i.test(k))||pool[0],sure:false}}
// use the set name the scan guessed to cut down same-name cards (only if it leaves something)
function pfNarrow(list,r){
  const w=String(r.set_name||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(x=>x.length>2&&!/^(the|and|set|tcg|pokemon)$/.test(x));
  if(list.length<2||!w.length)return list;
  const t=list.filter(c=>w.every(x=>c.s.toLowerCase().includes(x)));return t.length?t:list}
async function bPhotoFill(b,file){
  const pageIdx=BD.page,pg=b.pages[pageIdx],N=b.cols*b.rows;
  modal(`<h3>Reading your page…</h3><p class="mu">This takes a few seconds.</p>`);
  let cards;
  try{
    const img=await loadImg(file);
    const r=await claudeRead(img,{page:true,cols:b.cols,rows:b.rows});
    cards=Array.isArray(r.cards)?r.cards:[];
    if(!cards.length)throw new Error('I could not find any cards in that photo');
    await loadData();
    if(cards.some(c=>/japan|chin|korea|other/i.test(String(c.language||''))))try{await loadJP()}catch(e){}
  }catch(err){modal(`<h3>Couldn't read the page</h3><p class="mu">${esc(err.message||err)}</p><button class="btn" id="no">OK</button>`);$('#no').onclick=()=>closeModal();return}
  let placed=0,kept=0,empty=0,guessed=0;const review=[];
  for(const c of cards){
    const pos=parseInt(c.pos,10);if(!(pos>=1&&pos<=N))continue;
    if(c.empty||(!c.name&&!c.name_english&&!c.number)){empty++;continue}
    if(pg[pos-1]){kept++;continue}
    const m=await tMatch(c);if(!m.foreign)m.list=pfNarrow(m.list,c);const label=(c.name_english||c.name||'?')+(c.number?' '+c.number+(c.set_total?'/'+c.set_total:''):'');
    if(m.list.length===1&&(m.exact||!m.num)&&!m.foreign){const pk=pfPick(m.list[0],c.finish),k=pk.k;pg[pos-1]=Object.assign({i:m.list[0].i,k,a:m.list[0].v[k][0]||0},pk.sure?{}:{q:1});placed++;if(!pk.sure)guessed++}
    else{let pairs=tPairs(m.list,80);if(!m.foreign&&pairs.length){const f=pairs[0].c,best=pfPick(f,c.finish);pairs.sort((x,y)=>(x.c===f&&x.k===best.k?0:1)-(y.c===f&&y.k===best.k?0:1))}
      review.push({pos,label,finish:c.finish,note:!m.list.length?'No match found.':m.foreign?"This language isn't on TCGplayer, so there's no exact price. Pick a similar card:":'Best guess is first. Which one is it?',pairs,shown:8})}}
  bSave();bRender();
  const draw=()=>{
    modal(`<h3>Page read</h3><p class="mu">${placed} card${placed===1?'':'s'} placed${guessed?` (${guessed} marked <b style="color:#f59e0b">check</b>: I guessed the printing, tap them to confirm)`:''}${kept?` · ${kept} pocket${kept===1?'':'s'} already had a card`:''}${empty?` · ${empty} empty`:''}${review.length?` · ${review.length} need a quick look`:''}.</p>
    ${review.map((rv,ri)=>`<div class="review"><b>Pocket ${rv.pos}: ${esc(rv.label)}</b><div class="mu">${esc(rv.note)}</div>${rv.pairs.slice(0,rv.shown).map((p,pi)=>`<button class="item pair" data-ri="${ri}" data-pi="${pi}"><img src="${esc(p.c.img)}" loading="lazy" alt=""><div style="flex:1;min-width:0"><b style="margin:0">${esc(p.c.name)}</b>${p.c.lang==='jp'?'<span class="lang">JP</span>':''}<div class="mu">${esc(p.c.set)} · #${esc(p.c.number)}<br>${esc(p.k)}</div></div><span class="tag">${p.c.v[p.k][0]>0?money(p.c.v[p.k][0]):'—'}</span></button>`).join('')}<div class="row">${rv.pairs.length>rv.shown?`<button class="chip" data-more="${ri}">Show more (${rv.pairs.length-rv.shown} left)</button>`:''}<button class="chip" data-find="${ri}">🔍 Search for it</button><button class="chip" data-skip="${ri}">Skip</button></div></div>`).join('')}
    ${review.some(r=>r.pairs.length)?`<button class="btn alt" id="pfall" style="margin-top:8px">✨ Place all best guesses</button>`:''}
    <button class="btn" id="no" style="margin-top:8px">Done</button>`);
    $('#no').onclick=()=>closeModal();
    if($('#pfall'))$('#pfall').onclick=()=>{for(const rv of review.slice()){if(!rv.pairs.length)continue;const p=rv.pairs[0];pg[rv.pos-1]={i:p.c.i,k:p.k,a:p.c.v[p.k][0]||0,q:1};review.splice(review.indexOf(rv),1);placed++;guessed++}bSave();bRender();draw()};
    document.querySelectorAll('#modal .pair').forEach(el=>el.onclick=()=>{const rv=review[+el.dataset.ri],p=rv.pairs[+el.dataset.pi];pg[rv.pos-1]={i:p.c.i,k:p.k,a:p.c.v[p.k][0]||0};review.splice(+el.dataset.ri,1);placed++;bSave();bRender();draw()});
    document.querySelectorAll('#modal [data-more]').forEach(el=>el.onclick=()=>{const sc=document.querySelector('#modal .sheet').scrollTop;review[+el.dataset.more].shown+=12;draw();document.querySelector('#modal .sheet').scrollTop=sc});
    document.querySelectorAll('#modal [data-find]').forEach(el=>el.onclick=()=>{const rv=review[+el.dataset.find];tPick((c,k)=>{pg[rv.pos-1]={i:c.i,k,a:c.v[k][0]||0};const ix=review.indexOf(rv);if(ix>=0)review.splice(ix,1);placed++;bSave();bRender();setTimeout(draw,450)},draw)});
    document.querySelectorAll('#modal [data-skip]').forEach(el=>el.onclick=()=>{review.splice(+el.dataset.skip,1);draw()})};
  draw()}

// share a page as a picture
function bLoadCardImg(url){
  return new Promise(res=>{
    const tryProxy=()=>{fetch(SCAN_URL+'?img='+encodeURIComponent(url)).then(r=>r.ok?r.blob():Promise.reject()).then(bl=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=URL.createObjectURL(bl)}).catch(()=>res(null))};
    const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=tryProxy;i.src=url})}
async function bShareImage(b){
  modal(`<h3>Making your picture…</h3><p class="mu">One moment.</p>`);
  const pg=b.pages[BD.page],W=1080,pad=36,gap=18,head=150,foot=70,cw=Math.floor((W-pad*2-gap*(b.cols-1))/b.cols),ch=Math.round(cw*1.4);
  const H=head+b.rows*ch+(b.rows-1)*gap+foot+pad;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  const grad=g.createLinearGradient(0,0,W,H);grad.addColorStop(0,'#10192e');grad.addColorStop(.55,'#0a1020');grad.addColorStop(1,'#101a30');g.fillStyle=grad;g.fillRect(0,0,W,H);
  g.fillStyle='#fff';g.textAlign='center';g.font='bold 54px system-ui,sans-serif';g.fillText(b.name,W/2,80);
  const own=pg.reduce((s,r)=>s+ownVal(r),0);
  g.font='28px system-ui,sans-serif';g.fillStyle='#6ee7b7';g.fillText(`Page ${BD.page+1} of ${b.pages.length} · ${money(own)}`,W/2,125);
  const imgs=await Promise.all(pg.map(r=>{const c=r&&cardById(r.i);return c?bLoadCardImg(c.img):Promise.resolve(null)}));
  pg.forEach((r,i)=>{
    const x=pad+(i%b.cols)*(cw+gap),y=head+Math.floor(i/b.cols)*(ch+gap);
    g.fillStyle='rgba(255,255,255,.06)';g.strokeStyle='rgba(245,197,66,.5)';g.lineWidth=3;
    g.beginPath();g.roundRect?g.roundRect(x,y,cw,ch,14):g.rect(x,y,cw,ch);g.fill();g.stroke();
    const c=r&&cardById(r.i);if(!c)return;
    g.save();g.globalAlpha=r.w?.45:1;
    if(imgs[i])g.drawImage(imgs[i],x+4,y+4,cw-8,ch-8);
    else{g.fillStyle='#fff';g.font='bold 26px system-ui,sans-serif';g.textAlign='center';g.fillText(c.name.slice(0,18),x+cw/2,y+ch/2)}
    g.restore();
    const v=refVal(r);g.fillStyle='rgba(6,28,22,.92)';g.fillRect(x+4,y+ch-46,cw-8,42);g.fillStyle='#6ee7b7';g.textAlign='center';g.font='bold 26px system-ui,sans-serif';g.fillText((r.w?'♡ ':'')+(v>0?money(v):'—'),x+cw/2,y+ch-16)});
  g.fillStyle='rgba(255,255,255,.6)';g.font='22px system-ui,sans-serif';g.textAlign='center';g.fillText('Binder Buddy · Near Mint market prices',W/2,H-30);
  let blob;try{blob=await new Promise((ok,no)=>cv.toBlob(x=>x?ok(x):no(new Error('no image')),'image/png'))}
  catch(e){modal(`<h3>Couldn't make the picture</h3><p class="mu">The card images could not be used by the browser. Try again later.</p><button class="btn" id="no">OK</button>`);$('#no').onclick=()=>closeModal();return}
  const url=URL.createObjectURL(blob),file=new File([blob],'binder-page.png',{type:'image/png'});
  modal(`<h3>Your page</h3><img src="${url}" alt="Binder page" style="width:100%;border-radius:10px"><p class="mu">Press and hold the picture to save it, or use the buttons.</p><button class="btn" id="sh">Share</button><a class="btn alt" id="dl" style="margin-top:8px;text-decoration:none" href="${url}" download="binder-page.png">Download</a><button class="btn alt" id="no" style="margin-top:8px">Close</button>`);
  $('#no').onclick=()=>closeModal();
  $('#sh').onclick=async()=>{try{if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:b.name});else $('#dl').click()}catch(e){}}}

  $('#fvcopy').onclick=()=>{const nb=bClean(b);nb.name=(g.name+' (from @'+g.owner+')').slice(0,40);BD.binders.push(nb);bSave();toast('Saved to your binders')};
  document.querySelectorAll('#friendsView .pk.has[data-i]').forEach(btn=>btn.onclick=()=>{
    const r=pg[+btn.dataset.i],c=r&&cardById(r.i);if(!c)return;
    modal(`<h3>${esc(c.name)}${r.w?' <span class="mu">♡ looking for this</span>':''}</h3><p class="mu">${esc(c.set)}${c.lang==='jp'?' · JP':''} · #${esc(c.number)}<br>Near Mint · ${esc(r.k)} · ${money(refVal(r))}</p><a class="btn alt" style="text-decoration:none" target="_blank" rel="noopener" href="${esc(link(c,r.k))}">Open on TCGplayer</a><button class="btn" id="no" style="margin-top:8px">Close</button>`);
    $('#no').onclick=()=>closeModal()})}

if(ACC.handle){api('me').then(m=>fvBadge(m.incoming.length)).catch(()=>{});ftLoad(true)}

// ================= How it works, share links, deep links =================
const HELP_STEPS=[
 {e:'📒',t:'Your binders',d:'Build digital copies of your real binders. Add cards by name or by photo, drag to rearrange, and see what each page and the whole binder is worth at Near Mint market prices.'},
 {e:'📷',t:'Fill a page from one photo',d:'Lay a binder page flat, snap one photo, and Binder Buddy reads all the pockets. It places the most likely printing of each card and flags the ones to double-check.'},
 {e:'🔄',t:'Trade and sell lists',d:'Tap a card and choose List for trade or sale. Make a separate list for each card show or meetup, mark each card Trade, Sale or both, and set a price if you like.'},
 {e:'👥',t:'Friends and sharing',d:'Pick a handle, with no email or sign-up. Each binder is Private, Friends only or Public. Friends can see your trade lists and the cards you are looking for (♡), and you can see theirs.'},
];
function helpDlg(i){
  i=i||0;const st=HELP_STEPS[i],last=i===HELP_STEPS.length-1;
  modal(`<div class="hstep"><div class="big">${st.e}</div><h3>${st.t}</h3><p class="mu">${st.d}</p></div><div class="hdots">${HELP_STEPS.map((_,n)=>`<i class="${n===i?'on':''}"></i>`).join('')}</div>
  <button class="btn" id="hnext">${last?'Get started':'Next'}</button>${i>0?'<button class="btn alt" id="hback" style="margin-top:8px">Back</button>':(!last?'<button class="btn alt" id="hskip" style="margin-top:8px">Skip</button>':'')}`);
  $('#hnext').onclick=()=>{if(last){helpDone()}else{closeModal();setTimeout(()=>helpDlg(i+1),300)}};
  if($('#hback'))$('#hback').onclick=()=>{closeModal();setTimeout(()=>helpDlg(i-1),300)};
  if($('#hskip'))$('#hskip').onclick=helpDone}
function helpDone(){try{localStorage.setItem('bb_seen','1')}catch(e){}closeModal()}
$('#helpbtn').onclick=()=>helpDlg(0);
function linkBase(){return location.origin+location.pathname}
async function shareUrl(url,title){
  try{if(navigator.share){await navigator.share({url,title});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(url);toast('Link copied')}catch(e){modal(`<h3>Copy this link</h3><input id="lk" type="text" readonly value="${esc(url)}" style="width:100%"><button class="btn" id="lkx" style="margin-top:10px">Close</button>`);$('#lk').select();$('#lkx').onclick=()=>closeModal()}}
const binderLink=(owner,id)=>linkBase()+'#b='+encodeURIComponent(owner)+'/'+encodeURIComponent(id);
const profileLink=h=>linkBase()+'#u='+encodeURIComponent(h);
function openDeepLink(){
  let m=location.hash.match(/^#b=([^/]+)\/(.+)$/);
  if(m){showTab('friends');fvGo('binder',{owner:decodeURIComponent(m[1]).toLowerCase(),id:decodeURIComponent(m[2])});return true}
  m=location.hash.match(/^#u=(.+)$/);
  if(m){showTab('friends');fvGo('profile',{handle:decodeURIComponent(m[1]).toLowerCase()});return true}
  return false}

bLoad();showTab('binders',true);bCheckShared();
if(!openDeepLink()){let seen=false;try{seen=!!localStorage.getItem('bb_seen')}catch(e){}if(!seen&&!location.hash&&!BD.binders.some(b=>b.pages.some(p=>p.some(Boolean)))&&!ACC.handle)setTimeout(()=>helpDlg(0),700)}
</script></body></html>
