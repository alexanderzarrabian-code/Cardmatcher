name: Update prices

on:
  schedule:
    - cron: '30 21 * * *'   # every night, after tcgcsv updates (~20:00 UTC)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build price files
        run: python3 build_prices.py
      - name: Save changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json
          if [ -f prices_jp.json ]; then git add prices_jp.json; fi
          git diff --cached --quiet || (git commit -m "Update prices" && git push)
